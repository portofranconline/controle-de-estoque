<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0b1220">
<script>try{var t=localStorage.getItem("estoque.tema");if(t==="light"||t==="dark")document.documentElement.setAttribute("data-theme",t);}catch(e){}</script>
<title>Controle de Estoque</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<script src="supabase-config.js"></script>
<style>
/* layout: app de uma coluna para o polegar, agora com visual de painel de controle — fundo em grade, cartões de vidro, números em fonte mono */
:root{
  --bg:#eef3f9; --bg2:#e2eaf4; --surface:#ffffff; --surface2:#f6f9fd; --ink:#0b1626; --muted:#5a6b82; --line:#d3deeb;
  --brand:#0a1a33; --brand-ink:#ffffff; --cyan:#0891b2; --accent:#ea6a10; --accent-ink:#ffffff;
  --good:#05875f; --good-bg:#d9f6ea; --warn:#a15c00; --warn-bg:#fff0cc; --crit:#c2281f; --crit-bg:#fde2df;
  --field:#f3f7fc; --glow:rgba(8,145,178,.18); --gridc:rgba(10,26,51,.05);
  --display:"Space Grotesk","Segoe UI",system-ui,sans-serif; --body:"Inter",system-ui,-apple-system,"Segoe UI",Arial,sans-serif; --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#060b16; --bg2:#0a1324; --surface:#0e1829; --surface2:#122038; --ink:#e6eef9; --muted:#8597b2; --line:#1f2f4a;
  --brand:#0a1426; --brand-ink:#e6eef9; --cyan:#22d3ee; --accent:#ff8a3c; --accent-ink:#1a0d02;
  --good:#34d399; --good-bg:rgba(52,211,153,.12); --warn:#fbbf24; --warn-bg:rgba(251,191,36,.12); --crit:#f87171; --crit-bg:rgba(248,113,113,.13);
  --field:#0a1324; --glow:rgba(34,211,238,.22); --gridc:rgba(34,211,238,.05); color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#060b16; --bg2:#0a1324; --surface:#0e1829; --surface2:#122038; --ink:#e6eef9; --muted:#8597b2; --line:#1f2f4a;
  --brand:#0a1426; --brand-ink:#e6eef9; --cyan:#22d3ee; --accent:#ff8a3c; --accent-ink:#1a0d02;
  --good:#34d399; --good-bg:rgba(52,211,153,.12); --warn:#fbbf24; --warn-bg:rgba(251,191,36,.12); --crit:#f87171; --crit-bg:rgba(248,113,113,.13);
  --field:#0a1324; --glow:rgba(34,211,238,.22); --gridc:rgba(34,211,238,.05); color-scheme:dark;}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);background-image:linear-gradient(var(--gridc) 1px,transparent 1px),linear-gradient(90deg,var(--gridc) 1px,transparent 1px);background-size:28px 28px;background-attachment:fixed;color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.4;-webkit-tap-highlight-color:transparent}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
#app{max-width:860px;margin:0 auto;min-height:100%;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--brand) 88%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);color:var(--brand-ink);padding:14px 16px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--cyan);box-shadow:0 1px 0 var(--glow),0 8px 24px -12px var(--glow)}
.top::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--cyan);box-shadow:0 0 0 4px var(--glow),0 0 12px var(--cyan);flex:0 0 auto}
.top h1{font-family:var(--display);font-size:22px;font-weight:700;letter-spacing:.04em;margin:0;flex:1;text-transform:uppercase;text-wrap:balance}
.top .back{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.18);color:var(--brand-ink);border-radius:10px;padding:10px 14px;font-weight:600;min-height:44px;font-family:var(--mono);font-size:13px;letter-spacing:.06em;text-transform:uppercase}
.pad{padding:16px;display:flex;flex-direction:column;gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;box-shadow:0 1px 0 rgba(255,255,255,.03) inset}
.big{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.bigbtn{position:relative;overflow:hidden;background:linear-gradient(145deg,var(--surface2),var(--surface));color:var(--ink);border:1px solid var(--cyan);border-radius:18px;padding:18px 16px;text-align:left;display:flex;flex-direction:column;gap:8px;min-height:150px;box-shadow:0 0 0 1px var(--glow),0 10px 30px -14px var(--glow);transition:transform .12s ease,box-shadow .12s ease}
.bigbtn::after{content:"";position:absolute;right:-30px;top:-30px;width:120px;height:120px;border-radius:50%;background:radial-gradient(var(--glow),transparent 70%)}
.bigbtn:hover{box-shadow:0 0 0 1px var(--cyan),0 14px 34px -12px var(--glow)}
.bigbtn:active{transform:translateY(2px)}
.bigbtn b{font-family:var(--display);font-size:34px;line-height:1;text-transform:uppercase;letter-spacing:.02em}
.bigbtn.alt{border-color:var(--accent);box-shadow:0 0 0 1px color-mix(in srgb,var(--accent) 25%,transparent),0 10px 30px -14px color-mix(in srgb,var(--accent) 40%,transparent)}
.bigbtn.alt b{color:var(--accent)}
.bigbtn:not(.alt) b{color:var(--cyan)}
.bigbtn small{font-size:14px;color:var(--muted)}
.pills{display:flex;flex-wrap:wrap;gap:6px}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:6px;padding:3px 8px;font-size:12px;font-weight:600;white-space:nowrap;font-family:var(--mono);letter-spacing:.02em;border:1px solid transparent}
.pill.good{background:var(--good-bg);color:var(--good);border-color:color-mix(in srgb,var(--good) 30%,transparent)} .pill.warn{background:var(--warn-bg);color:var(--warn);border-color:color-mix(in srgb,var(--warn) 30%,transparent)} .pill.crit{background:var(--crit-bg);color:var(--crit);border-color:color-mix(in srgb,var(--crit) 30%,transparent)}
.pill.on{background:rgba(255,255,255,.12);color:inherit}
.row{display:flex;gap:10px;flex-wrap:wrap}
.btn{border-radius:12px;padding:12px 16px;font-weight:600;min-height:48px;display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--surface2);flex:1 1 150px;transition:border-color .12s,box-shadow .12s}
.btn:hover{border-color:var(--cyan)}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:transparent;box-shadow:0 6px 18px -8px var(--accent)}
.btn.brand{background:var(--cyan);color:#04121a;border-color:transparent;box-shadow:0 6px 18px -8px var(--cyan)}
.btn.good{background:var(--good);color:#04140d;border-color:transparent}
.btn.sm{min-height:44px;padding:8px 12px;flex:0 0 auto;font-size:15px}
.btn:active{filter:brightness(.92)}
.btn[disabled]{opacity:.5}
label.f{display:flex;flex-direction:column;gap:6px;font-weight:600;font-size:12px;color:var(--muted);font-family:var(--mono);text-transform:uppercase;letter-spacing:.08em}
.inp,select.inp{background:var(--field);border:1px solid var(--line);border-radius:12px;padding:12px;min-height:48px;width:100%;color:var(--ink);font-size:17px;font-weight:500;font-family:var(--body);text-transform:none;letter-spacing:0}
.inp:focus{border-color:var(--cyan);box-shadow:0 0 0 3px var(--glow);outline:none}
.who{border-color:var(--accent);border-width:2px;font-weight:700}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.chip{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 14px;font-weight:600;min-height:42px;font-size:14px}
.chip.on{background:var(--glow);color:var(--cyan);border-color:var(--cyan);box-shadow:0 0 12px -4px var(--cyan)}
.list{display:flex;flex-direction:column;gap:10px}
.item{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px;display:grid;grid-template-columns:68px 1fr;gap:12px;align-items:center;position:relative}
.item.crit{box-shadow:inset 3px 0 0 var(--crit)} .item.warn{box-shadow:inset 3px 0 0 var(--warn)} .item.good{box-shadow:inset 3px 0 0 var(--good)}
.ph{width:68px;height:68px;border-radius:12px;object-fit:cover;background:var(--field);display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:22px;color:var(--muted);border:1px solid var(--line);padding:0;overflow:hidden}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.item h3{margin:0;font-size:17px;font-weight:700;overflow-wrap:anywhere}
.qty{font-family:var(--mono);font-size:26px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums;color:var(--cyan)}
.meta{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;color:var(--muted);font-size:13px}
.acts{grid-column:1/-1;display:flex;gap:8px}
.acts .btn{flex:1 1 0;min-height:50px}
.acts .more{flex:0 0 50px}
.empty{color:var(--muted);text-align:center;padding:24px 8px;font-family:var(--mono);font-size:14px}
.note{background:var(--warn-bg);color:var(--warn);border:1px solid color-mix(in srgb,var(--warn) 30%,transparent);border-radius:12px;padding:12px;font-weight:600}
.note.crit{background:var(--crit-bg);color:var(--crit);border-color:color-mix(in srgb,var(--crit) 30%,transparent)}
h2{font-family:var(--display);font-size:18px;text-transform:uppercase;letter-spacing:.08em;margin:0;display:flex;align-items:center;gap:8px}
h2::before{content:"";width:4px;height:18px;border-radius:2px;background:var(--cyan);box-shadow:0 0 8px var(--cyan)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;position:relative;overflow:hidden}
.kpi::before{content:"";position:absolute;left:0;top:0;right:0;height:2px;background:linear-gradient(90deg,var(--cyan),transparent)}
.kpi span{display:block;color:var(--muted);font-size:11px;font-weight:600;font-family:var(--mono);text-transform:uppercase;letter-spacing:.06em}
.kpi b{font-family:var(--mono);font-size:28px;line-height:1.2;font-variant-numeric:tabular-nums;display:block;margin-top:4px}
.kpi em{display:block;font-style:normal;font-size:12px;color:var(--muted)}
.chart{width:100%;height:auto;display:block}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{font-family:var(--mono);font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
.tbl td,.tbl th{padding:9px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.tbl tr:hover td{background:var(--surface2)}
.tbl td.n,.tbl th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap;font-family:var(--mono)}
.scroll{overflow-x:auto}
.tag{display:inline-flex;align-items:center;gap:8px;background:var(--field);border:1px solid var(--line);border-radius:8px;padding:5px 5px 5px 12px;font-weight:600}
.tag button{width:30px;height:30px;border-radius:6px;background:var(--crit-bg);color:var(--crit);font-weight:700}
.tags{display:flex;flex-wrap:wrap;gap:8px}
#veil{position:fixed;inset:0;background:rgba(2,6,14,.62);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);z-index:20;display:none;align-items:flex-end;justify-content:center}
#veil.open{display:flex}
#sheet{background:var(--surface);color:var(--ink);width:100%;max-width:560px;border-radius:20px 20px 0 0;border:1px solid var(--line);border-top:1px solid var(--cyan);padding:18px 16px 22px;max-height:92%;overflow-y:auto;display:flex;flex-direction:column;gap:14px;box-shadow:0 -10px 40px -10px var(--glow)}
@media (min-width:640px){#veil{align-items:center}#sheet{border-radius:20px;border:1px solid var(--cyan)}}
.step{display:grid;grid-template-columns:64px 1fr 64px;gap:10px;align-items:center}
.step button{height:64px;border-radius:14px;background:var(--surface2);border:1px solid var(--cyan);color:var(--cyan);font-size:32px;font-weight:700;line-height:1;font-family:var(--mono)}
.step input{text-align:center;font-family:var(--mono);font-size:34px;font-weight:700;height:64px;padding:0}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--surface2);color:var(--ink);border:1px solid var(--cyan);box-shadow:0 0 24px -6px var(--glow);padding:12px 18px;border-radius:12px;font-weight:600;z-index:40;display:none;max-width:90%;text-align:center}
#toast.show{display:block}
.top .sub{margin:2px 0 0;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--cyan);font-weight:600;font-family:var(--mono)}
.lead{font-family:var(--display);font-size:22px;text-transform:uppercase;letter-spacing:.06em;margin:4px 0 0}
.bigbtn .ico{font-size:38px;line-height:1;position:relative;z-index:1}
.soon{border:1px dashed var(--line);border-radius:14px;padding:14px;color:var(--muted);font-weight:600;text-align:center;background:var(--surface);font-family:var(--mono);font-size:14px}
.adm{align-self:center;color:var(--muted);font-weight:600;padding:12px 18px;border-radius:10px;min-height:44px;border:1px solid var(--line);font-family:var(--mono);font-size:13px;letter-spacing:.06em;text-transform:uppercase}
.adm:hover{border-color:var(--cyan);color:var(--cyan)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(164px,1fr));gap:12px}
.pcard{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden;display:flex;flex-direction:column;transition:transform .14s ease,box-shadow .14s ease,border-color .14s}
.pcard:hover{transform:translateY(-3px);border-color:var(--cyan);box-shadow:0 12px 28px -14px var(--glow)}
.pcard .pic{aspect-ratio:4/3;background:var(--field);display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:34px;color:var(--muted);overflow:hidden;border-bottom:1px solid var(--line)}
.pcard .pic img{width:100%;height:100%;object-fit:cover;display:block}
.pcard .body{padding:10px 12px 12px;display:flex;flex-direction:column;gap:6px;flex:1}
.pcard h3{margin:0;font-size:14px;font-weight:700;line-height:1.25;overflow-wrap:anywhere;text-transform:uppercase;letter-spacing:.03em}
.pcard .est{color:var(--muted);font-size:13px}
.pcard .est b{font-family:var(--mono);font-size:24px;color:var(--cyan);font-variant-numeric:tabular-nums}
.pcard .btn{margin-top:auto;flex:0 0 auto;width:100%;min-height:48px;font-size:15px;letter-spacing:.08em;text-transform:uppercase}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 12px;text-align:left;display:flex;flex-direction:column;gap:8px;min-height:96px;font-weight:600;transition:border-color .12s,box-shadow .12s}
.tile:hover{border-color:var(--cyan);box-shadow:0 0 0 1px var(--glow)}
.tile .ico{font-size:24px;line-height:1}
.tile.pri{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.tile:active{filter:brightness(.94)}
.res{background:var(--good-bg);color:var(--good);border:1px solid color-mix(in srgb,var(--good) 30%,transparent);border-radius:12px;padding:12px;font-weight:700;display:grid;gap:4px}
.badge{background:var(--glow);color:var(--cyan);border:1px solid var(--cyan);border-radius:6px;padding:6px 10px;font-size:12px;font-weight:600;white-space:nowrap;font-family:var(--mono)}
.bigbtn .logo{position:relative;z-index:1;background:#fff;border-radius:12px;height:88px;padding:10px 14px;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 10px rgba(0,0,0,.18)}
.bigbtn .logo img{max-height:68px;max-width:100%;object-fit:contain;display:block}
.top .hlogo{height:38px;max-width:120px;object-fit:contain;background:#fff;border-radius:8px;padding:4px 8px;flex:0 0 auto}
@media (max-width:420px){.big{grid-template-columns:1fr}.bigbtn{min-height:120px}}
@media (prefers-reduced-motion:no-preference){#sheet{animation:up .18s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}}
</style>
</head>
<body>
<div id="app"><div class="top"><div><h1>Controle de estoque</h1><p class="sub">Estoque da unidade · Aplicativo independente</p></div></div><div class="pad"><div class="card empty" id="boot">Carregando o estoque…</div></div></div>
<div id="veil"><div id="sheet" role="dialog" aria-modal="true"></div></div>
<div id="toast" role="status"></div>
<input type="file" id="pick" accept="image/*" hidden>

/* Cada site guarda a sua própria conexão e login neste aparelho.

const LS_NS = (() => { try { const p = location.pathname.replace(/index\.html$/, "").replace(/\/+$/, ""); return (p === "" || p === "/controle-de-estoque") ? "estoque" : "estoque@" + p; } catch(e) { return "estoque"; } })();
const LOCAIS = ["POSTO","BR PARK"];
/* nomes e locais por unidade (cfg/main → locais). A chave interna continua POSTO / BR PARK. */
function cfgLocais(){ return (typeof S !== "undefined" && S.cfg && S.cfg.locais) || {}; }
function nomeLocal(l){ const o = cfgLocais()[l]; return (o && o.nome) || l; }
function logoLocal(l){ const o = cfgLocais()[l] || {}; if (o.foto) return o.foto; return (o.nome || !LOGO[l]) ? "" : LOGO[l]; }
/* todos os estoques da filial: os dois padrão + os criados pelo administrador (ex.: Pista) */
function todosLocais(){
  const o = cfgLocais(), v = [...LOCAIS, ...Object.keys(o).filter(k => o[k] && o[k].extra && !o[k].excluido).sort()];
  if (typeof S !== "undefined" && S.prod) v.forEach(l => { if (!S.prod[l]) S.prod[l] = {}; });
  return v;
}
function locaisAtivos(){ const o = cfgLocais(), v = todosLocais().filter(l => !(o[l] && o[l].oculto)); return v.length ? v : ["POSTO"]; }

const fmt = v => num(v).toLocaleString("pt-BR", {maximumFractionDigits:3});

const parseQ = s => { s = String(s ?? "").trim().replace(",", "."); if (s === "" || isNaN(Number(s))) return NaN; return Math.round(Number(s) * 1000) / 1000; };

/* ---------- login (Supabase Auth) ---------- */
const AUTH = {url:"", key:""};
const SESS_KEY = LS_NS + ".sessao";
let refrescando = null;
function sessaoSalva(){ try { return JSON.parse(localStorage.getItem(SESS_KEY) || "null"); } catch(e) { return null; } }
function gravaSessao(s){ S.sess = s || null; try { if (s) localStorage.setItem(SESS_KEY, JSON.stringify(s)); else localStorage.removeItem(SESS_KEY); } catch(e) {} }
function guardaTokens(j, uid){ gravaSessao({access:j.access_token, refresh:j.refresh_token, exp:Date.now() + Number(j.expires_in || 3600) * 1000, uid:(j.user && j.user.id) || uid}); }
async function api(metodo, caminho, corpo, comToken = true){
  const h = {apikey:AUTH.key, "Content-Type":"application/json", Accept:"application/json"};
  if (comToken) Object.assign(h, await authHeader());
  const r = await fetch(AUTH.url + caminho, {method:metodo, headers:h, body: corpo === undefined ? undefined : JSON.stringify(corpo), cache:"no-store"});
  const txt = await r.text(); let j = null; try { j = txt ? JSON.parse(txt) : null; } catch(e) {}
  if (!r.ok) { const err = new Error((j && (j.message || j.msg || j.error_description || j.error)) || ("HTTP " + r.status)); err.status = r.status; throw err; }
  return j;
}
async function authHeader(){
  const t = await tokenValido();
  if (t) return {Authorization:"Bearer " + t};
  return /^eyJ/.test(AUTH.key) ? {Authorization:"Bearer " + AUTH.key} : {};
}
async function tokenValido(){
  const s = S.sess; if (!s) return null;
  if (s.exp - 60000 > Date.now()) return s.access;

function deepMerge(target, patch){
  if (!patch || typeof patch !== "object" || Array.isArray(patch)) return patch;
  const out = (target && typeof target === "object" && !Array.isArray(target)) ? {...target} : {};
  for (const [k,v] of Object.entries(patch)) out[k] = (v && typeof v === "object" && !Array.isArray(v)) ? deepMerge(out[k], v) : v;
  return out;
}
function createLocalDB(){
  const KEYDB = LS_NS + ".db.v1"; let store={};
  try { store=JSON.parse(localStorage.getItem(KEYDB)||"{}"); } catch(e) { store={}; }
  const save=()=>localStorage.setItem(KEYDB,JSON.stringify(store));
  const emit=path=>{ const ls=window.__estoqueListeners?.[path]||[]; const snap={exists:store[path]!==undefined,data:()=>store[path]}; ls.forEach(fn=>{try{fn(snap)}catch(e){}}); };
  const notify=()=>Object.values(window.__estoqueCollectionListeners||{}).flat().forEach(fn=>{try{fn()}catch(e){}});
  const doc=path=>({set:async d=>{store[path]=JSON.parse(JSON.stringify(d||{}));save();emit(path);notify()},update:async p=>{store[path]=deepMerge(store[path]||{},p||{});save();emit(path);notify()},onSnapshot:fn=>{window.__estoqueListeners||={};(window.__estoqueListeners[path]||=[]).push(fn);fn({exists:store[path]!==undefined,data:()=>store[path]});return()=>{window.__estoqueListeners[path]=(window.__estoqueListeners[path]||[]).filter(x=>x!==fn)}}});
  const collection=name=>({onSnapshot:fn=>{const send=()=>fn({docs:Object.entries(store).filter(([k])=>k.startsWith(name+"/")).map(([k,v])=>({id:k.slice(name.length+1),data:()=>v}))});window.__estoqueCollectionListeners||={};(window.__estoqueCollectionListeners[name]||=[]).push(send);send();return()=>{window.__estoqueCollectionListeners[name]=(window.__estoqueCollectionListeners[name]||[]).filter(x=>x!==send)}}});
  return {doc,collection};
}
function createSupabaseDB(){
  /* Lê e grava na tabela public.docs (colunas filial, id, data), só da filial conectada. IDs: cfg/main, prod/POSTO, prod/BRPARK, foto/<código>, movs/<AAAA-MM>. */
  const cfg = configAtual();
  const url = String(cfg.url || "").trim(), key = String(cfg.anonKey || "").trim();
  if (!/^https:\/\/[a-z0-9-]+\.supabase\.co\/?$/i.test(url) || !key) { console.error("supabase-config.js: url ou anonKey inválidos."); return null; }
  const base = url.replace(/\/$/,"") + "/rest/v1/docs";
  const headers = {"apikey":key,"Content-Type":"application/json","Accept":"application/json"};
  const pollMs = Math.max(2000, Number(cfg.pollMs) || 5000);
  const cache = new Map();
  async function req(q, opts={}){
    const r = await fetch(base + q, {...opts, cache:"no-store", headers:{...headers, ...(await authHeader()), ...(opts.headers||{})}});
    const txt = await r.text();
    if (!r.ok) { const e = new Error("Supabase HTTP " + r.status + ": " + txt); e.status = r.status; throw e; }
    return txt ? JSON.parse(txt) : null;
  }
  const enc = s => encodeURIComponent(s);
  const F = String(cfg.filial || "").trim(); if (!F) { console.error("Filial não informada."); return null; }
  const fq = "filial=eq." + enc(F) + "&";
  async function getDoc(id){
    const rows = await req("?" + fq + "id=eq." + enc(id) + "&select=id,data");
    if (!rows || !rows.length) return {exists:false, id, data:()=>undefined};
    const d = rows[0].data; cache.set(id, d); return {exists:true, id, data:()=>d};
  }
  const docListeners = new Map();
  async function notifyDoc(id){ const s = await getDoc(id); (docListeners.get(id)||[]).forEach(fn => { try { fn(s); } catch(e) { console.error(e); } }); }
  const doc = id => ({
    async set(data){ await req("", {method:"POST", headers:{Prefer:"resolution=merge-duplicates,return=minimal"}, body:JSON.stringify({filial:F, id, data})}); cache.set(id, data); await notifyDoc(id); },
    async update(patch){ const cur = (await getDoc(id)).data(); const data = deepMerge(cur || {}, patch || {});
      if (cur === undefined) await req("", {method:"POST", headers:{Prefer:"resolution=merge-duplicates,return=minimal"}, body:JSON.stringify({filial:F, id, data})});
      else await req("?" + fq + "id=eq." + enc(id), {method:"PATCH", headers:{Prefer:"return=minimal"}, body:JSON.stringify({data})});
      cache.set(id, data); await notifyDoc(id); },
    onSnapshot(fn, onErr){
      const arr = docListeners.get(id) || []; arr.push(fn); docListeners.set(id, arr);
      let active = true;
      const poll = () => getDoc(id).then(s => { if (active) fn(s); }).catch(e => { console.error(e); if (active && onErr) onErr(e); });
      poll(); const t = setInterval(poll, pollMs);
      return () => { active = false; clearInterval(t); docListeners.set(id, (docListeners.get(id)||[]).filter(x => x !== fn)); };
    }
  });
  const collection = name => ({ onSnapshot(fn, onErr){
    let active = true;
    const poll = async () => {
      try {
        const rows = await req("?" + fq + "id=like." + enc(name + "/") + "*&select=id,data");
        if (!active) return;
        fn({docs:(rows||[]).map(x => ({id:x.id.slice(name.length+1), data:()=>x.data}))});
      } catch(e) { console.error(e); if (active && onErr) onErr(e); }
    };
    poll(); const t = setInterval(poll, pollMs);
    return () => { active = false; clearInterval(t); };
  }});
  return {doc, collection};
}

  const d = new Date(m.t), ym = d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0");
  const id = "m" + m.t.toString(36) + Math.random().toString(36).slice(2,6);

  const it = S.prod[local][pid]; const antes = num(it.e);

function filtrados(local, busca, cat){
  const q = semAcento(busca.trim());
  return itens(local).filter(([,it]) => (!q || semAcento(it.n).includes(q)) && (cat === "Todos" || it.c === cat));
}

function precisaOper(){ if (S.oper) return true; toast("Primeiro selecione quem está operando."); const o = $("#oper"); if (o) o.focus(); return false; }
function shMov(pid, tp){
  if (!precisaOper()) return;
  const it = S.prod[S.local][pid], c = cfg(), ret = tp === "R";
  if (ret && num(it.e) <= 0) { toast("Sem estoque de " + it.n + "."); return; }
  openSheet(`<h2>${ret ? "Retirar" : "Adicionar ao estoque"}</h2>
    <div class="item" style="border:0;padding:0;border-left:0"><div class="ph">${photo(pid,it)}</div><div><h3>${esc(it.n)}</h3><div class="meta">Estoque atual <b>${fmt(it.e)}</b> ${esc(it.u || "")} · ${S.local}</div></div></div>
    <label class="f" for="q">${ret ? "Quanto deseja retirar?" : "Quantidade que chegou"}</label>
    <div class="step"><button data-act="menos" aria-label="Diminuir">−</button><input id="q" class="inp" inputmode="decimal" value="1" autocomplete="off"><button data-act="mais1" aria-label="Aumentar">+</button></div>
    ${ret ? `<label class="f" for="entr">Quem está entregando?<select id="entr" class="inp"><option value="">Selecione o operador</option>${(c.usuarios || []).map(n => `<option>${esc(n)}</option>`).join("")}</select></label>
    <label class="f" for="colab">Quem vai receber?<select id="colab" class="inp"><option value="">Selecione o colaborador</option>${c.colaboradores.map(n => `<option>${esc(n)}</option>`).join("")}<option value="+">+ Adicionar colaborador</option></select></label>
    <label class="f" id="novoColabBox" for="novoColab" hidden>Nome do novo colaborador<input id="novoColab" class="inp" autocomplete="off"></label>` : ""}
    <div id="err" class="note crit" hidden></div>
    <div class="row"><button class="btn" data-act="fechar">Cancelar</button><button class="btn ${ret ? "pri" : "good"}" data-act="confMov" data-p="${pid}" data-tp="${tp}">${ret ? "Confirmar retirada" : "Confirmar entrada"}</button></div>
    <p class="meta">Operando: ${esc(S.oper)}</p>`);
}
async function confMov(pid, tp, btn){
  const it = S.prod[S.local][pid], q = parseQ($("#q").value), err = $("#err"), ret = tp === "R";
  const fail = m => { err.textContent = m; err.hidden = false; };
  if (!ret) return fail("A entrada de estoque é feita só na área administrativa.");
  if (!(q > 0)) return fail("Digite uma quantidade maior que zero. Ex.: 2 ou 2,5.");
  if (ret && q > num(it.e)) return fail(`⚠️ Estoque insuficiente. Você pediu ${fmt(q)} e só tem ${fmt(it.e)} ${it.u || ""}.`);
  let colab = "", entr = "";
  if (ret) {
    entr = $("#entr").value;
    if (!entr) return fail("Selecione quem está entregando o produto.");
    colab = $("#colab").value;
    if (colab === "+") { colab = $("#novoColab").value.trim(); if (!colab) return fail("Digite o nome do novo colaborador."); }
    if (!colab) return fail("Selecione quem vai receber o produto.");
  }
  btn.disabled = true;
  const ok = await safe(async () => {
    if (ret && !cfg().colaboradores.includes(colab)) await S.db.doc("cfg/main").update({colaboradores:[...cfg().colaboradores, colab]});
    const d = await movimentar(S.local, pid, tp, q, colab, undefined, entr);
    toast(`${ret ? "Retirada" : "Entrada"} registrada. ${it.n}: ${fmt(d)} ${it.u || ""} em estoque.`);
  });
  if (ok) closeSheet(); else btn.disabled = false;
}

async function salvarNovo(btn){
  const n = $("#nNome").value.trim(), l = $("#nLocal").value, q = parseQ($("#nQtd").value), m = parseQ($("#nMin").value), err = $("#err");
  const fail = t => { err.textContent = t; err.hidden = false; };
  if (!n) return fail("Digite o nome do produto.");
  if (!(q >= 0)) return fail("Quantidade inicial inválida.");
  if (itens(l).some(([,it]) => semAcento(it.n) === semAcento(n))) return fail("Já existe um produto com esse nome em " + nomeLocal(l) + ".");
  const pid = (l === "POSTO" ? "P" : "B") + Date.now().toString(36);
  btn.disabled = true;
  const ok = await safe(async () => {
    await S.db.doc("prod/" + KEY(l)).update({itens:{[pid]:{n, c:$("#nCat").value, u:$("#nUni").value, m: m >= 0 ? m : 0, e:q}}});
    await addMov({t:Date.now(), l, p:pid, n, tp:"C", q, a:0, d:q, u:S.adminNome || "Administrador", c:""});
  }, n + " cadastrado em " + nomeLocal(l) + ".");
  if (ok) { closeSheet(); go("aprod", {admLocal:l, abusca:""}); } else btn.disabled = false;
}

async function confEntrada(btn){
  const l = $("#aLocal").value, pid = $("#aProd").value, q = parseQ($("#q").value), err = $("#err"), res = $("#res");
  const fail = m => { res.hidden = true; err.textContent = m; err.hidden = false; };
  if (!pid || !S.prod[l][pid]) return fail("Selecione o produto.");
  if (!(q > 0)) return fail("Digite uma quantidade maior que zero. Ex.: 20 ou 2,5.");
  const it = S.prod[l][pid], antes = num(it.e);
  btn.disabled = true; err.hidden = true;
  let depois = null;
  const ok = await safe(async () => { depois = await movimentar(l, pid, "E", q, "", S.adminNome || "Administrador"); });

  if (ok) { res.innerHTML = `<span>${esc(it.n)} · ${esc(nomeLocal(l))}</span><span>Estoque anterior: ${fmt(antes)}</span><span>Entrada: +${fmt(q)}</span><span>Novo estoque: ${fmt(depois)}</span>`; res.hidden = false; $("#q").value = "1"; $("#aProd").innerHTML = `<option value="">Selecione o produto</option>` + optsProd(l, ""); }

function mesAtual(tps, local){
  const ym = now.getFullYear() + "-" + String(now.getMonth()+1).padStart(2,"0"), d = S.movs[ym]; let t = 0;
  if (d) for (const m of Object.values(d.itens || {})) if (tps.includes(m.tp) && (local === "Todos" || m.l === local)) t += num(m.q);
  return Math.round(t*1000)/1000;
}

async function fotoLocal(l, arq){
  if (!arq) return;

    const url = await new Promise((ok, erro) => { const r = new FileReader(); r.onload = () => ok(r.result); r.onerror = erro; r.readAsDataURL(arq); });
    const img = await new Promise((ok, erro) => { const i = new Image(); i.onload = () => ok(i); i.onerror = erro; i.src = url; });
    const k = Math.min(1, 480 / Math.max(img.width, img.height)), cv = document.createElement("canvas");
    cv.width = Math.round(img.width * k); cv.height = Math.round(img.height * k);
    const g = cv.getContext("2d"); g.fillStyle = "#fff"; g.fillRect(0, 0, cv.width, cv.height); g.drawImage(img, 0, 0, cv.width, cv.height);
    const foto = cv.toDataURL("image/jpeg", 0.82);
    await safe(() => S.db.doc("cfg/main").update({locais:{[l]:{foto}}}), "Foto do estoque salva.");
  } catch (e) { console.error("Foto do estoque:", e); toast("Não foi possível usar essa imagem."); }
}

function movsFiltrados(f){

function paginasTabela(titulo, sub, cols, linhas){
  const W = 1240, H = 1754, M = 70, LH = 44, TOPO = 270, BASE = 120;
  const porPag = Math.floor((H - TOPO - BASE) / LH), total = Math.max(1, Math.ceil(linhas.length / porPag)), pags = [], quando = new Date().toLocaleString("pt-BR");
  for (let p = 0; p < total; p++) {
    const cv = document.createElement("canvas"); cv.width = W; cv.height = H; const g = cv.getContext("2d");
    g.fillStyle = "#ffffff"; g.fillRect(0, 0, W, H); g.fillStyle = "#0a1a33"; g.fillRect(0, 0, W, 160); g.fillStyle = "#22d3ee"; g.fillRect(0, 160, W, 6);
    g.fillStyle = "#ffffff"; g.font = "bold 46px Arial"; g.fillText(cortaTexto(g, titulo, W - 2 * M), M, 75);
    g.font = "26px Arial"; g.fillText(cortaTexto(g, sub, W - 2 * M), M, 122);
    g.fillStyle = "#5a6b82"; g.font = "22px Arial"; g.fillText("Gerado em " + quando + " · página " + (p + 1) + " de " + total, M, 215);
    let y = TOPO; g.fillStyle = "#e2eaf4"; g.fillRect(M - 12, y - 31, W - 2 * M + 24, LH);
    g.fillStyle = "#0b1626"; g.font = "bold 22px Arial"; cols.forEach(([t, x]) => g.fillText(t, M + x, y)); y += LH; g.font = "22px Arial";
    linhas.slice(p * porPag, (p + 1) * porPag).forEach((r, i) => {
      if (i % 2) { g.fillStyle = "#f3f7fc"; g.fillRect(M - 12, y - 31, W - 2 * M + 24, LH); }
      g.fillStyle = "#0b1626"; r.forEach((t, k) => g.fillText(cortaTexto(g, t, (k + 1 < cols.length ? cols[k + 1][1] : W - 2 * M + 10) - cols[k][1] - 14), M + cols[k][1], y)); y += LH;
    });
    if (!linhas.length) { g.fillStyle = "#5a6b82"; g.fillText("Nada encontrado.", M, y); }
    g.font = "19px Arial"; g.fillStyle = "#8a99ad"; g.fillText("Desenvolvido por Luís Ricardo Menezes · Aldo Porto Franco", M, H - 40);
    pags.push(cv);
  }
  return pags;
}
async function exportarPaginas(b, pags, tipo, nome){
  b.disabled = true;
  try {
    if (tipo === "pdf") baixarArquivo(await pdfDePaginas(pags), nome + ".pdf");
    else if (pags.length === 1) baixarArquivo(await jpegDe(pags[0]), nome + ".jpg");
    else { const cv = document.createElement("canvas"); cv.width = pags[0].width; cv.height = pags[0].height * Math.min(pags.length, 8); const g = cv.getContext("2d"); pags.slice(0, 8).forEach((p, i) => g.drawImage(p, 0, i * p.height)); baixarArquivo(await jpegDe(cv), nome + ".jpg"); }
    toast("Arquivo " + tipo.toUpperCase() + " gerado.");
  } catch (e) { console.error("Exportar:", e); toast("Não foi possível gerar o arquivo."); }
  b.disabled = false;

    const nome = l.slice(0, l.search(/\d/)).replace(/R\$|RS\b/gi, " ").replace(/[^A-Za-zÀ-ÿ' .-]/g, " ").replace(/\s+/g, " ").trim();

function vRel(){
  const anos = [...new Set([now.getFullYear(), S.relAno, ...Object.values(S.movs).map(d => d.a)])].filter(Boolean).sort();
  const ms = movsDoAno(S.relAno), uso = Array(12).fill(0), ent = Array(12).fill(0);
  for (const m of ms) { const k = new Date(m.t).getMonth(); if (m.tp === "R") uso[k] += num(m.q); if (m.tp === "E" || m.tp === "C") ent[k] += num(m.q); }
  const r3 = a => a.map(v => Math.round(v*1000)/1000), U = r3(uso), E = r3(ent);
  const topU = Math.max(...U) > 0 ? U.indexOf(Math.max(...U)) : -1, topE = Math.max(...E) > 0 ? E.indexOf(Math.max(...E)) : -1;
  const doMes = ms.filter(m => new Date(m.t).getMonth() === S.relMes - 1).sort((a,b) => b.t - a.t);
  const agg = (arr, key) => { const o = {}; for (const m of arr) o[m[key] || "—"] = (o[m[key] || "—"] || 0) + num(m.q); return Object.entries(o).sort((a,b) => b[1]-a[1]); };
  const retMes = doMes.filter(m => m.tp === "R"), porProd = agg(retMes, "n").slice(0,8), porColab = agg(retMes, "c");
  const tab = (rows, h1) => rows.length ? `<table class="tbl"><tr><th>${h1}</th><th class="n">Quantidade</th></tr>${rows.map(([k,v]) => `<tr><td>${esc(k)}</td><td class="n">${fmt(v)}</td></tr>`).join("")}</table>` : `<p class="meta">Sem retiradas neste mês.</p>`;
  return admTop("Histórico", "admin") + `<div class="pad">
    <div class="row"><label class="f" for="rAno" style="flex:1 1 100px">Ano<select id="rAno" class="inp">${anos.map(a => `<option ${a === S.relAno ? "selected" : ""}>${a}</option>`).join("")}</select></label>
    <label class="f" for="rMes" style="flex:1 1 140px">Mês<select id="rMes" class="inp">${MESES.map((m,i) => `<option value="${i+1}" ${i+1 === S.relMes ? "selected" : ""}>${m}</option>`).join("")}</select></label>
    <label class="f" for="rLocal" style="flex:1 1 130px">Local<select id="rLocal" class="inp">${["Todos",...locaisAtivos()].map(l => `<option value="${l}" ${l === S.relLocal ? "selected" : ""}>${esc(l === "Todos" ? l : nomeLocal(l))}</option>`).join("")}</select></label></div>
    <div class="kpis">
      <div class="kpi"><span>Mês que mais usou em ${S.relAno}</span><b>${topU >= 0 ? MESES[topU] : "—"}</b><em>${topU >= 0 ? fmt(U[topU]) + " itens retirados" : "sem retiradas no ano"}</em></div>
      <div class="kpi"><span>Mês que mais entrou estoque</span><b>${topE >= 0 ? MESES[topE] : "—"}</b><em>${topE >= 0 ? fmt(E[topE]) + " itens adicionados" : "sem entradas no ano"}</em></div>
      <div class="kpi"><span>Retirado em ${MESES[S.relMes-1]}</span><b>${fmt(U[S.relMes-1])}</b><em>${retMes.length} retirada${retMes.length === 1 ? "" : "s"}</em></div>
      <div class="kpi"><span>Adicionado em ${MESES[S.relMes-1]}</span><b>${fmt(E[S.relMes-1])}</b><em>${doMes.filter(m => m.tp === "E" || m.tp === "C").length} lançamento(s) de entrada</em></div>
    </div>
    <div class="card"><h2>Uso por mês em ${S.relAno}</h2><p class="meta" style="margin:4px 0 8px">Soma das quantidades retiradas. O mês de maior uso fica em destaque; o mês escolhido tem contorno.</p>${barras(U, "var(--brand)", "Ainda sem retiradas em " + S.relAno + ".")}</div>
    <div class="card"><h2>Entradas por mês em ${S.relAno}</h2><p class="meta" style="margin:4px 0 8px">Soma das quantidades que chegaram ao estoque.</p>${barras(E, "var(--good)", "Ainda sem entradas em " + S.relAno + ".")}</div>
    <div class="card"><h2>Mais retirados em ${MESES[S.relMes-1]}</h2>${tab(porProd, "Produto")}</div>
    <div class="card"><h2>Quem recebeu em ${MESES[S.relMes-1]}</h2>${tab(porColab, "Colaborador")}</div>
    <div class="card"><h2>Movimentações de ${MESES[S.relMes-1]} de ${S.relAno}</h2><div class="scroll">${doMes.length ? `<table class="tbl"><tr><th>Data</th><th>Operação</th><th>Produto</th><th class="n">Qtd.</th><th class="n">Ficou</th><th>Recebeu</th><th>Operador</th></tr>${doMes.slice(0,200).map(m => { const d = new Date(m.t); return `<tr><td>${d.toLocaleDateString("pt-BR",{day:"2-digit",month:"2-digit"})} ${d.toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"})}</td><td>${TP[m.tp] || m.tp}</td><td>${esc(m.n)}<br><span class="meta">${esc(m.l)}</span></td><td class="n">${fmt(m.q)}</td><td class="n">${fmt(m.d)}</td><td>${esc(m.c || "—")}</td><td>${esc(m.u)}</td></tr>`; }).join("")}</table>` : `<p class="meta">Nenhuma movimentação neste mês.</p>`}</div></div></div>`;
}

function pedirFoto(pid){ S.fotoPid = pid; const p = $("#pick"); p.value = ""; p.click(); }
$("#pick").addEventListener("change", async e => {
  const f = e.target.files && e.target.files[0], pid = S.fotoPid; if (!f || !pid) return;
  if (!S.admin) return toast("Área restrita ao administrador.");
  try {
    const url = URL.createObjectURL(f), im = new Image();
    await new Promise((ok, no) => { im.onload = ok; im.onerror = no; im.src = url; });
    const c = document.createElement("canvas"), sz = 180, s = Math.min(im.width, im.height); c.width = c.height = sz;
    c.getContext("2d").drawImage(im, (im.width - s)/2, (im.height - s)/2, s, s, 0, 0, sz, sz);
    URL.revokeObjectURL(url);
    const d = c.toDataURL("image/jpeg", 0.8);
    if (await safe(() => S.db.doc("foto/" + pid).set({d}), "Foto atualizada.")) closeSheet();
  } catch(err) { toast("Não foi possível ler essa imagem. Tente outra foto."); }
});

let ultimaAssinatura = null;
function refresh(){
  if (S.state === "login" || S.state === "setup") return;
  if (S.got.cfg && S.got.prod) S.state = S.cfg ? "ok" : "empty";
  // as consultas automáticas chamam refresh() a cada poucos segundos; sem mudança real, não redesenha (senão o select fecha antes da escolha)
  const assinatura = [S.state, S.view, S.local, S.oper, S.cat, S.busca, S.admin, JSON.stringify(S.cfg), JSON.stringify(S.prod), Object.keys(S.fotos).length, Object.keys(S.movs).length, Object.values(S.movs).reduce((n, d) => n + Object.keys(d.itens || {}).length, 0)].join("|");
  if (assinatura === ultimaAssinatura) return;
  ultimaAssinatura = assinatura;
  const ae = document.activeElement, typing = ae && (["busca","abusca"].includes(ae.id) || ae.tagName === "SELECT");
  if ($("#veil").classList.contains("open")) { if (S.view === "local") renderList(); else if (S.view === "aprod") renderAList(); return; }
  if (S.state === "ok" && typing) { if (S.view === "local") renderList(); else renderAList(); }
  else render();
}
let dadosIniciados = false;
function iniciarDados(){
  if (dadosIniciados) return; dadosIniciados = true;
  const db = S.db;
  S.state = "boot"; render();
  const slow = setTimeout(() => { if (S.state === "boot") { S.state = "slow"; render(); } }, 10000);
  const falhou = e => { console.error("Banco online:", e); if (S.state !== "ok" && S.state !== "login") { clearTimeout(slow); S.state = "nodb"; render(); } };
  const localPhotoMap = {};
  ["B003.jpg","B005.jpg","B035.jpg","Bmwcbpanl.jpg","P002.jpg","P003.jpg","P005.jpg","P007.jpg","P009.jpg","P016.jpg","P017.jpg","P024.jpg","P027.jpg","P028.jpg","P029.jpg","P035.jpg","Pmwcblh23.jpg"].forEach(f => localPhotoMap[f.replace(/\.jpg$/i,"")] = "dados/fotos/" + f);
  S.fotos = {...localPhotoMap};
  // cfg/main → usuários (campo "Selecione o seu nome"), colaboradores, categorias, unidades, senha
  // cfg/main → public.app_docs (id = 'cfg/main'): lê o campo data e extrai a lista "usuarios" (select "Selecione o seu nome")
  console.log("[ESTOQUE] Buscando cfg/main…");
  db.doc("cfg/main").onSnapshot(s => {
    clearTimeout(slow);
    try {
      const novo = !s.exists;
      let dados = novo ? cfgPadrao() : s.data();
      if (typeof dados === "string") { console.log("[ESTOQUE] campo data veio como texto; convertendo JSON…"); dados = JSON.parse(dados); }
      if (!dados || typeof dados !== "object" || Array.isArray(dados)) throw new Error("campo data não é um objeto JSON (tipo recebido: " + (Array.isArray(dados) ? "array" : typeof dados) + ")");
      S.cfg = dados;
      if (novo && S.admin) S.db.doc("cfg/main").set(dados).catch(err => console.error("[ESTOQUE] não foi possível criar cfg/main:", err));
      console.log("[ESTOQUE] cfg/main encontrado");
      console.log("[ESTOQUE] Dados do cfg/main:", dados);
      if (!Array.isArray(dados.usuarios)) throw new Error("propriedade 'usuarios' ausente ou não é lista. Chaves recebidas: " + Object.keys(dados).join(", "));
      const nomes = dados.usuarios.filter(x => typeof x === "string" && x.trim() !== "");
      console.log("[ESTOQUE] Funcionários encontrados (" + nomes.length + "):", nomes);
      if (nomes.length === 0) console.warn("[ESTOQUE] 'usuarios' está vazio em cfg/main: o select 'Selecione o seu nome' não terá nomes para mostrar.");
    } catch (err) {
      console.error("[ESTOQUE] ERRO AO CARREGAR cfg/main:", err && err.message ? err.message : err);
      S.cfg = null;
    }
    S.got.cfg = true; refresh();
  }, err => { console.error("[ESTOQUE] ERRO AO CARREGAR cfg/main:", err && err.message ? err.message : err); falhou(err); });
  // prod/POSTO → produtos do POSTO; prod/BRPARK → produtos do BR PARK
  db.collection("prod").onSnapshot(q => {
    console.log("[ESTOQUE] prod: registros encontrados em public.app_docs:", q.docs.map(d => d.id));
    if (!q.docs.some(d => d.id === "POSTO")) console.error("[ESTOQUE] ERRO AO CARREGAR produtos do POSTO: prod/POSTO não encontrado em public.app_docs");
    for (const d of q.docs) {
      const l = d.id === "BRPARK" ? "BR PARK" : d.id;
      if (!l) continue;
      const src = (d.data() || {}).itens || {}, out = {};
      for (const [id, it] of Object.entries(src)) {
        if (!it || typeof it !== "object") continue;
        out[id] = {...it, c: typeof it.c === "number" ? (BASECATS[it.c] || "Outros") : (it.c || "Outros"), u: it.u || "Unidade", m: it.m ?? 1, e: num(it.e),
          i: Number.isInteger(it.i) ? it.i : (/^[PB]\d{3}$/.test(id) ? Number(id.slice(1)) - 1 : undefined)};
      }
      S.prod[l] = out;
      console.log("[ESTOQUE] dados brutos de " + d.id + ":", d.data());
      console.log("[ESTOQUE] " + l + ": produtos identificados =", Object.keys(out).length, "(ativos:", Object.values(out).filter(x => !x.x && x.n).length + ")");
    }
    S.got.prod = true; refresh();
  }, falhou);
  db.collection("foto").onSnapshot(q => { const o = {...localPhotoMap}; for (const d of q.docs) { const v = d.data(); if (v && typeof v.d === "string" && v.d.startsWith("data:image/")) o[d.id] = v.d; } S.fotos = o; if (S.state === "ok") refresh(); }, () => {});
  db.collection("movs").onSnapshot(q => { const o = {}; for (const d of q.docs) o[d.id] = d.data() || {}; S.movs = o; if (S.state === "ok") refresh(); }, () => {});
  db.collection("vendas").onSnapshot(q => { const o = {}; for (const d of q.docs) o[d.id] = d.data() || {}; const k = JSON.stringify(o); if (k !== S.vendasK) { S.vendasK = k; S.vendas = o; if (S.view === "ranking") render(); } }, () => {});
}

const SQL_INSTALACAO = "-- INSTALAÇÃO DE UMA UNIDADE NOVA (projeto Supabase vazio)\n-- Rode inteiro no SQL Editor do projeto. Pode rodar uma vez só.\n-- Depois, abra o app, informe a URL e a chave publicável e crie o administrador.\n\ncreate table if not exists public.app_docs (\n  id text primary key,\n  data jsonb not null default '{}'::jsonb,\n  updated_at timestamptz not null default now()\n);\n\n-- 01 — PREPARAÇÃO DOS LOGINS\n-- Não bloqueia o app: a tabela public.app_docs continua como está.\n-- Rode no SQL Editor do projeto Supabase da unidade nova.\n\nbegin;\n\ncreate extension if not exists pgcrypto with schema extensions;\n\n-- perfis de acesso: um por usuário do Supabase Auth\ncreate table if not exists public.perfis (\n  user_id uuid primary key references auth.users(id) on delete cascade,\n  login text not null,\n  papel text not null check (papel in ('admin','operador')),\n  criado_em timestamptz not null default now()\n);\ncreate unique index if not exists perfis_login_unico on public.perfis (lower(login));\nalter table public.perfis enable row level security;\n\ndrop policy if exists perfis_ler on public.perfis;\n-- (a política usa eh_admin, criada abaixo)\n\n-- o usuário logado é administrador?\ncreate or replace function public.eh_admin() returns boolean\nlanguage sql stable security definer set search_path = public as $$\n  select exists (select 1 from public.perfis where user_id = auth.uid() and papel = 'admin');\n$$;\n\n-- já existe administrador? (usado na primeira abertura do app)\ncreate or replace function public.tem_admin() returns boolean\nlanguage sql stable security definer set search_path = public as $$\n  select exists (select 1 from public.perfis where papel = 'admin');\n$$;\n\n-- transforma o login em e-mail interno: \"Inácio\" -> inacio@estoque.local\ncreate or replace function public.email_do_login(p_login text) returns text\nlanguage sql immutable as $$\n  select regexp_replace(lower(translate(trim(p_login),\n    'áàâãäéèêëíìîïóòôõöúùûüçñÁÀÂÃÄÉÈÊËÍÌÎÏÓÒÔÕÖÚÙÛÜÇÑ',\n    'aaaaaeeeeiiiiooooouuuucnaaaaaeeeeiiiiooooouuuucn')), '[^a-z0-9]', '', 'g') || '@estoque.local';\n$$;\n\n-- cria a conta no Supabase Auth com senha (uso interno das funções abaixo)\ncreate or replace function public.criar_usuario_auth(p_email text, p_senha text) returns uuid\nlanguage plpgsql security definer set search_path = public, auth, extensions as $$\ndeclare v_id uuid := gen_random_uuid();\nbegin\n  if length(coalesce(p_senha,'')) < 6 then raise exception 'Use uma senha com pelo menos 6 caracteres.'; end if;\n  if exists (select 1 from auth.users where email = p_email) then raise exception 'Esse login já existe.'; end if;\n  insert into auth.users (instance_id, id, aud, role, email, encrypted_password, email_confirmed_at,\n      raw_app_meta_data, raw_user_meta_data, created_at, updated_at,\n      confirmation_token, recovery_token, email_change_token_new, email_change)\n  values ('00000000-0000-0000-0000-000000000000', v_id, 'authenticated', 'authenticated', p_email,\n      extensions.crypt(p_senha, extensions.gen_salt('bf')), now(),\n      '{\"provider\":\"email\",\"providers\":[\"email\"]}'::jsonb, '{}'::jsonb, now(), now(), '', '', '', '');\n  insert into auth.identities (id, user_id, identity_data, provider, provider_id, last_sign_in_at, created_at, updated_at)\n  values (gen_random_uuid(), v_id,\n      jsonb_build_object('sub', v_id::text, 'email', p_email, 'email_verified', true, 'phone_verified', false),\n      'email', v_id::text, now(), now(), now());\n  return v_id;\nend $$;\n\n-- primeiro administrador (só funciona se ainda não houver nenhum)\ncreate or replace function public.criar_primeiro_admin(p_login text, p_email text, p_senha text) returns void\nlanguage plpgsql security definer set search_path = public, auth, extensions as $$\ndeclare v_id uuid;\nbegin\n  if public.tem_admin() then raise exception 'Já existe um administrador.'; end if;\n  v_id := public.criar_usuario_auth(lower(trim(p_email)), p_senha);\n  insert into public.perfis (user_id, login, papel) values (v_id, trim(p_login), 'admin');\nend $$;\n\n-- administrador cria login de operador (ex.: Kaliel)\ncreate or replace function public.criar_operador(p_login text, p_senha text) returns void\nlanguage plpgsql security definer set search_path = public, auth, extensions as $$\ndeclare v_id uuid;\nbegin\n  if not public.eh_admin() then raise exception 'Apenas o administrador cria logins.'; end if;\n  if trim(coalesce(p_login,'')) = '' then raise exception 'Digite o nome do login.'; end if;\n  if exists (select 1 from public.perfis where lower(login) = lower(trim(p_login))) then raise exception 'Esse login já existe.'; end if;\n  v_id := public.criar_usuario_auth(public.email_do_login(p_login), p_senha);\n  insert into public.perfis (user_id, login, papel) values (v_id, trim(p_login), 'operador');\nend $$;\n\n-- administrador redefine a senha de um operador\ncreate or replace function public.redefinir_senha(p_login text, p_senha text) returns void\nlanguage plpgsql security definer set search_path = public, auth, extensions as $$\ndeclare v_id uuid;\nbegin\n  if not public.eh_admin() then raise exception 'Apenas o administrador redefine senhas.'; end if;\n  if length(coalesce(p_senha,'')) < 6 then raise exception 'Use uma senha com pelo menos 6 caracteres.'; end if;\n  select user_id into v_id from public.perfis where lower(login) = lower(trim(p_login));\n  if v_id is null then raise exception 'Login não encontrado.'; end if;\n  update auth.users set encrypted_password = extensions.crypt(p_senha, extensions.gen_salt('bf')), updated_at = now()\n   where id = v_id;\nend $$;\n\n-- quem vê a própria linha; o administrador vê todas (para a lista de logins)\ncreate policy perfis_ler on public.perfis for select to authenticated\n  using (user_id = auth.uid() or public.eh_admin());\n\n-- permissões das funções\nrevoke all on function public.criar_usuario_auth(text,text) from public, anon, authenticated;\nrevoke all on function public.eh_admin() from public, anon;\nrevoke all on function public.tem_admin() from public;\nrevoke all on function public.criar_primeiro_admin(text,text,text) from public;\nrevoke all on function public.criar_operador(text,text) from public, anon;\nrevoke all on function public.redefinir_senha(text,text) from public, anon;\ngrant execute on function public.eh_admin() to authenticated;\ngrant execute on function public.tem_admin() to anon, authenticated;\ngrant execute on function public.criar_primeiro_admin(text,text,text) to anon, authenticated;\ngrant execute on function public.criar_operador(text,text) to authenticated;\ngrant execute on function public.redefinir_senha(text,text) to authenticated;\n\ncommit;\n\n-- conferência (somente leitura)\nselect 'funções criadas' as item, count(*) from pg_proc\n where pronamespace = 'public'::regnamespace and proname in ('eh_admin','tem_admin','criar_primeiro_admin','criar_operador','redefinir_senha');\n\n-- 02 — BLOQUEIO: só quem entrou com login acessa os dados.\n-- RODE SOMENTE DEPOIS que o administrador criou a conta e entrou no app novo.\n-- Depois disso, o app antigo (sem login) deixa de funcionar — é o esperado.\n\nbegin;\n\nalter table public.app_docs enable row level security;\n\n-- remove as políticas antigas (eram abertas para o público)\ndo $$ declare r record; begin\n  for r in select policyname from pg_policies where schemaname = 'public' and tablename = 'app_docs' loop\n    execute format('drop policy %I on public.app_docs', r.policyname);\n  end loop;\nend $$;\n\n-- qualquer usuário logado lê\ncreate policy docs_ler_logado on public.app_docs for select to authenticated using (true);\n\n-- administrador: cadastro, edição de produtos, fotos, configurações\ncreate policy docs_admin_inserir on public.app_docs for insert to authenticated with check (public.eh_admin());\ncreate policy docs_admin_atualizar on public.app_docs for update to authenticated\n  using (public.eh_admin()) with check (public.eh_admin());\n\n-- operador: só grava estoque (prod/) e histórico (movs/), para retirada\ncreate policy docs_operador_inserir on public.app_docs for insert to authenticated\n  with check (id like 'prod/%' or id like 'movs/%');\ncreate policy docs_operador_atualizar on public.app_docs for update to authenticated\n  using (id like 'prod/%' or id like 'movs/%') with check (id like 'prod/%' or id like 'movs/%');\n\n-- sem política de exclusão: ninguém apaga linhas pela API\n\ncommit;\n";
const CFG_KEY = LS_NS + ".config";
const urlValida = s => /^https:\/\/[a-z0-9-]+\.supabase\.co\/?$/i.test(String(s || "").trim());
function configAtual(){
  const fixo = window.ESTOQUE_SUPABASE || {};
  try { const s = JSON.parse(localStorage.getItem(CFG_KEY) || "null"); if (s && s.url && s.anonKey) return s; if (s && s.filial && fixo.url && fixo.anonKey) return {...s, url:fixo.url, anonKey:fixo.anonKey}; } catch(e) {}
  return fixo;
}
const bancoFixo = () => { const f = window.ESTOQUE_SUPABASE || {}; return !!(f.url && f.anonKey); };
function cfgPadrao(){ return {usuarios:[], colaboradores:[], categorias:[...BASECATS], unidades:["Unidade","Pacote","Caixa","Par","Rolo","Litro"], locais:{"BR PARK":{nome:"", oculto:true}}}; }
function vSetup(){
  const c0 = configAtual();
  return `<div class="top"><div><h1>Controle de estoque</h1><p class="sub">Conectar a filial</p></div></div><div class="pad">
    <div class="card"><h2>Conectar a filial</h2>
    <p class="meta" style="margin:6px 0 10px">${bancoFixo() ? "Digite o código da sua filial. Fica salvo neste aparelho." : "Cole a URL e a chave do banco e digite o código da sua filial. Ficam salvos só neste aparelho."}</p>
    <details ${bancoFixo() ? "" : "open"} style="margin-bottom:8px"><summary class="meta" style="cursor:pointer">${bancoFixo() ? "Banco de dados já configurado (toque para ver)" : "Banco de dados"}</summary>
    <label class="f" for="sUrl">Project URL<input id="sUrl" class="inp" autocomplete="off" autocapitalize="none" spellcheck="false" placeholder="https://xxxxx.supabase.co" value="${esc(c0.url || "")}"></label>
    <label class="f" for="sKey" style="margin-top:8px">Chave publicável<input id="sKey" class="inp" autocomplete="off" autocapitalize="none" spellcheck="false" placeholder="sb_publishable_..." value="${esc(c0.anonKey || "")}"></label></details>
    <label class="f" for="sFil" style="margin-top:8px">Código da filial<input id="sFil" class="inp" inputmode="numeric" autocomplete="off" placeholder="Ex.: 020201"></label>
    <div id="sErr" class="note crit" hidden style="margin-top:10px"></div>
    <button class="btn pri" style="margin-top:12px" data-act="salvarBanco">Conectar</button>
    <p class="meta" style="margin:12px 0 0">Não tem esses dados? Peça ao responsável pelo sistema a URL, a chave e o código da filial.</p></div></div>`;
}
async function salvarBanco(b){
  const u = $("#sUrl").value.trim().replace(/\/$/, ""), k = $("#sKey").value.trim(), e = $("#sErr");
  if (!urlValida(u)) { e.textContent = "URL inválida. Use o formato https://xxxxx.supabase.co"; e.hidden = false; return; }
  if (!k) { e.textContent = "Cole a chave publicável."; e.hidden = false; return; }
  const f = $("#sFil").value.replace(/\D/g, "");
  if (!/^\d{3,10}$/.test(f)) { e.textContent = "Digite o código da filial (só números, ex.: 020201)."; e.hidden = false; return; }
  b.disabled = true; e.hidden = true;
  try {
    AUTH.url = u; AUTH.key = k;
    const nome = await api("POST", "/rest/v1/rpc/nome_da_filial", {p_codigo:f}, false);
    if (!nome) { const x = new Error("Filial " + f + " não encontrada. Confira o código."); x.filial = true; throw x; }
    try { localStorage.setItem(CFG_KEY, JSON.stringify({url:u, anonKey:k, filial:f, nomeFilial:nome})); } catch(err) { throw new Error("Este aparelho não permite guardar a configuração."); }
    toast("Filial " + f + ": " + nome);
    setTimeout(() => location.reload(), 700);
  } catch (err) {
    console.error("Conexão:", err);
    const falta = /could not find|schema cache|does not exist/i.test(err.message);
    e.textContent = err.filial ? err.message : falta ? "Este banco ainda não tem a instalação do banco único (arquivo 01). Avise o responsável." : "Não foi possível conectar: " + err.message;
    e.hidden = false; b.disabled = false;
  }
}
function trocarBanco(){ try { const c = configAtual(); if (c.url && c.anonKey) localStorage.setItem(CFG_KEY, JSON.stringify({url:c.url, anonKey:c.anonKey})); else localStorage.removeItem(CFG_KEY); } catch(e) {} gravaSessao(null); location.reload(); }
async function copiarSql(){
  try { await navigator.clipboard.writeText(SQL_INSTALACAO); toast("SQL copiado. Cole no SQL Editor do Supabase."); }
  catch (e) {
    const t = document.createElement("textarea"); t.value = SQL_INSTALACAO; document.body.appendChild(t); t.select();
    let ok = false; try { ok = document.execCommand("copy"); } catch (err) {}
    t.remove(); toast(ok ? "SQL copiado. Cole no SQL Editor do Supabase." : "Não consegui copiar. Use o arquivo sql/instalacao-nova-unidade.sql.");
  }
}
(async function start(){
  render();
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {}
  try {
    const qs = new URLSearchParams(location.search), qb = qs.get("b"), qk = qs.get("k"), qf = qs.get("f");
    if (qb && qk && qf && urlValida(qb)) {
      const atual = configAtual();
      if (atual.url !== qb || atual.anonKey !== qk || atual.filial !== qf) localStorage.setItem(CFG_KEY, JSON.stringify({url:qb, anonKey:qk, filial:qf, nomeFilial:""}));
    }
    const hs = new URLSearchParams(location.hash.replace(/^#/, ""));
    if (hs.get("type") === "recovery" && hs.get("access_token")) S.recuperacao = {access_token:hs.get("access_token"), refresh_token:hs.get("refresh_token"), expires_in:hs.get("expires_in") || 3600};
    else if (hs.get("error")) S.erroLink = "O link de troca de senha expirou ou já foi usado. Peça um novo em \"Esqueci minha senha\".";
    if (location.search || location.hash) history.replaceState(null, "", location.pathname);
  } catch (e) { console.error("Link:", e); }
  const c = configAtual();
  if (!urlValida(c.url) || !String(c.anonKey || "").trim() || !String(c.filial || "").trim()) { S.state = "setup"; render(); return; }
  AUTH.url = String(c.url).trim().replace(/\/$/, ""); AUTH.key = String(c.anonKey).trim();
  S.filial = String(c.filial).trim(); S.nomeFilial = c.nomeFilial || "";
  S.db = createSupabaseDB();
  if (!S.db) { S.state = "setup"; render(); return; }
  if (S.recuperacao) guardaTokens(S.recuperacao);
  S.sess = sessaoSalva();
  if (S.sess) {
    try { if ((await tokenValido()) && (await carregaPerfil())) return entrarNoApp(); }
    catch (e) { console.error("Sessão salva:", e); }
  }
  gravaSessao(null);
  S.modoLogin = "entrar";
  if (S.erroLink) setTimeout(() => toast(S.erroLink), 600);
  if (S.recuperacao) { S.recuperacao = null; setTimeout(() => toast("Não foi possível abrir o link. Peça um novo em \"Esqueci minha senha\"."), 600); }
  try { const n = await api("POST", "/rest/v1/rpc/nome_da_filial", {p_codigo:S.filial}, false); if (n) S.nomeFilial = n; }
  catch (e) { console.error("nome_da_filial:", e); }
  S.state = "login"; render();
})();
