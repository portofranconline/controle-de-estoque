<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#060b16">
<title>Checklist Serviços Gerais · Posto Aldo</title>
<link rel="icon" href="logo-aldo.png">
<!-- CHECKLIST OPERACIONAL — sistema independente do estoque e das metas.
     Usa só as tabelas ck_* (SQL 07-checklist.sql) e a pasta de fotos "checklist". Não lê nem grava docs/app_docs. -->
<style>
:root{--bg:#060b16;--surface:#0e1829;--surface2:#122038;--ink:#e6eef9;--muted:#8597b2;--line:#1f2f4a;--cyan:#22d3ee;--brand:#f97316;
  --top:#0a1426;--on-cyan:#002222;--on-brand:#1a0d02;--gridc:rgba(34,211,238,.045);--good:#34d399;--good-bg:rgba(52,211,153,.12);--warn:#fbbf24;--warn-bg:rgba(251,191,36,.12);--crit:#f87171;--crit-bg:rgba(248,113,113,.13);--info:#60a5fa;
  --display:"Space Grotesk","Segoe UI",system-ui,sans-serif;--body:"Inter",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);-webkit-text-size-adjust:100%}
body{min-height:100vh;background-image:linear-gradient(var(--gridc) 1px,transparent 1px),linear-gradient(90deg,var(--gridc) 1px,transparent 1px);background-size:28px 28px}
button,input,select,textarea{font:inherit;color:inherit}
.top{display:flex;align-items:center;gap:12px;padding:12px 16px;background:var(--top);border-bottom:1px solid var(--cyan);position:sticky;top:0;z-index:5}
.top img{height:32px;width:auto}
.top h1{margin:0;font-family:var(--display);font-size:18px;letter-spacing:.04em;text-transform:uppercase;line-height:1.15}
.top p{margin:2px 0 0;font-size:11px;letter-spacing:.1em;color:var(--cyan);text-transform:uppercase}
.top .sp{flex:1}
.wrap{max-width:860px;margin:0 auto;padding:12px 14px 90px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 14px;margin-bottom:10px}
.card h2{margin:0 0 8px;font-family:var(--display);font-size:16px}
.meta{font-size:12px;color:var(--muted)}
.btn{display:block;width:100%;border:1px solid var(--line);background:var(--surface2);border-radius:12px;padding:13px 14px;font-weight:700;cursor:pointer;margin-top:8px;text-align:center}
.btn.pri{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.btn.ok{background:var(--good);border-color:var(--good);color:#04241a}
.btn.no{background:var(--crit);border-color:var(--crit);color:#2a0606}
.btn.sm{display:inline-block;width:auto;padding:7px 11px;font-size:13px;margin:4px 4px 0 0}
.btn:disabled{opacity:.5}
.inp,select.inp,textarea.inp{width:100%;background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:11px;margin-top:4px;font-size:15px}
label.f{display:block;font-size:12px;color:var(--muted);margin-top:8px}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:10px 14px 0;max-width:860px;margin:0 auto}
.tabs button{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 13px;font-weight:700;font-size:13px;cursor:pointer}
.tabs button.on{background:var(--cyan);border-color:var(--cyan);color:var(--on-cyan)}
.task{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:10px}
.task.urg{border-color:var(--crit);box-shadow:0 0 0 1px var(--crit) inset}
.task .h{font-family:var(--display);font-size:26px;font-weight:700}
.task .n{font-size:17px;font-weight:700;margin-top:2px}
.pill{display:inline-block;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:700;margin-top:6px}
.p-pend{background:var(--crit-bg);color:var(--crit)}.p-and{background:var(--warn-bg);color:var(--warn)}.p-ok{background:var(--good-bg);color:var(--good)}
.p-obs{background:var(--warn-bg);color:var(--warn)}.p-no{background:var(--crit-bg);color:var(--crit)}.p-atr{background:var(--crit);color:#2a0606}.p-fut{background:var(--surface2);color:var(--muted)}
.ban{border-radius:12px;padding:10px 12px;margin-bottom:10px;font-weight:700;font-size:14px}
.ban.crit{background:var(--crit-bg);color:var(--crit);border:1px solid var(--crit)}.ban.warn{background:var(--warn-bg);color:var(--warn);border:1px solid var(--warn)}.ban.info{background:rgba(96,165,250,.12);color:var(--info);border:1px solid var(--info)}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px}
.tile{background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:10px}
.tile b{display:block;font-family:var(--display);font-size:26px}
.tile span{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.bar{height:12px;border-radius:8px;background:var(--surface2);overflow:hidden;margin-top:6px}.bar i{display:block;height:100%;background:var(--good)}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:11px;color:var(--muted);text-transform:uppercase}
tr.cl{cursor:pointer}tr.cl:hover{background:var(--surface2)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.fotos{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.fotos img{width:96px;height:96px;object-fit:cover;border-radius:10px;border:1px solid var(--line);cursor:pointer}
.fslot{border:1px dashed var(--line);border-radius:12px;padding:10px;margin-top:8px}
#veil{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;z-index:20;align-items:flex-end;justify-content:center}
#veil.open{display:flex}
#sheet{background:var(--surface);border:1px solid var(--line);border-radius:18px 18px 0 0;width:100%;max-width:620px;max-height:92vh;overflow:auto;padding:16px 16px calc(18px + env(safe-area-inset-bottom))}
#sheet h2{margin:0 0 8px;font-family:var(--display);font-size:18px}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(140%);background:var(--top);border:1px solid var(--cyan);border-radius:12px;padding:11px 16px;font-weight:700;z-index:30;transition:transform .25s;max-width:92vw;text-align:center}
#toast.show{transform:translateX(-50%) translateY(0)}
.sync{position:fixed;right:10px;bottom:10px;z-index:6;border-radius:999px;padding:6px 12px;font-size:12px;font-weight:700;background:var(--top);border:1px solid var(--line)}
.msg{text-align:center;padding:50px 20px;color:var(--muted);line-height:1.6}
.msg b{display:block;font-family:var(--display);font-size:20px;color:var(--ink);margin-bottom:6px}
.chk{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}.chk label{display:flex;align-items:center;gap:4px;background:var(--surface2);border:1px solid var(--line);border-radius:8px;padding:6px 8px;font-size:13px}
@media(max-width:560px){.hide-m{display:none}.grid2{grid-template-columns:1fr}table{font-size:12px}th,td{padding:7px 3px}td .pill{font-size:10.5px;padding:2px 6px;white-space:nowrap}}
@media print{.top,.tabs,.sync,#toast{display:none}}
</style>
<script src="supabase-config.js"></script>
</head>
<body>
<div class="top"><img src="logo-aldo.png" alt="Aldo" onerror="this.remove()"><div><h1 id="tTit">Checklist Serviços Gerais</h1><p id="tSub">Posto Aldo</p></div><div class="sp"></div><div id="tAcoes"></div></div>
<div id="tabs"></div>
<div class="wrap" id="app"><div class="msg">Carregando…</div></div>
<div id="veil"><div id="sheet"></div></div>
<div id="toast"></div>
<div id="sync" class="sync" hidden></div>
<script>
"use strict";
/* ================= base ================= */
const $ = s => document.querySelector(s), $$ = s => [...document.querySelectorAll(s)];
const esc = v => String(v == null ? "" : v).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const NS = (() => { const p = location.pathname.replace(/[^/]*$/, "").replace(/\/+$/, ""); return (p === "" || p === "/controle-de-estoque") ? "estoque" : "estoque@" + p; })();
const K = {sess:NS + ".ck.sessao", fil:NS + ".ck.filial", user:NS + ".ck.login", fila:NS + ".ck.fila", estSess:NS + ".sessao", estCfg:NS + ".config"};
const LS = {get:(k, d) => { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } }, set:(k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { return false; } }, del:k => { try { localStorage.removeItem(k); } catch (e) {} }};
const S = {view:"hoje", data:"", fil:{}, hist:null};
const TURNOS = {manha:"☀️ Manhã", tarde:"🌤️ Tarde", noite:"🌙 Noite"};
const FUNCOES = ["Limpeza", "Triagem", "Manutenção", "Serviços gerais"];
const ST = {pendente:["🔴 Pendente", "p-pend"], atrasado:["🔴 Atrasado", "p-atr"], andamento:["🟡 Em andamento", "p-and"], concluido:["🟢 Concluído", "p-ok"], concluido_obs:["⚠️ Concluído c/ observação", "p-obs"], nao_realizado:["❌ Não realizado", "p-no"], sem_registro:["❌ Não realizado · sem registro", "p-no"], futuro:["⏳ Programado", "p-fut"], agora:["🔵 Hora de fazer", "p-and"], estourado:["⏰ Passou do horário", "p-atr"]};
const MOTIVOS = ["Falta de material", "Local ocupado", "Problema estrutural", "Serviço impedido", "Falta de acesso", "Outro"];
const DIAS = ["Dom", "Seg", "Ter", "Qua", "Qui", "Sex", "Sáb"];
const FOTO = {nao:"Sem foto", sim:"📷 Foto obrigatória", antes_depois:"📷 Foto antes e depois"};
let toastT;
function toast(m){ const t = $("#toast"); t.textContent = m; t.classList.add("show"); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove("show"), 3400); }
function openSheet(h){ $("#sheet").innerHTML = h; $("#veil").classList.add("open"); $("#sheet").scrollTop = 0; }
function closeSheet(){ $("#veil").classList.remove("open"); $("#sheet").innerHTML = ""; }
$("#veil").addEventListener("click", e => { if (e.target.id === "veil") closeSheet(); });
const pad = n => String(n).padStart(2, "0");
const dStr = d => d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
const hoje = () => dStr(new Date());
const addDia = (s, n) => { const d = new Date(s + "T12:00:00"); d.setDate(d.getDate() + n); return dStr(d); };
const dBR = s => s ? s.slice(8, 10) + "/" + s.slice(5, 7) + "/" + s.slice(0, 4) : "";
const hm = t => t ? String(t).slice(0, 5) : "";
const hmTs = ts => ts ? new Date(ts).toLocaleTimeString("pt-BR", {hour:"2-digit", minute:"2-digit"}) : "";
const dhTs = ts => ts ? new Date(ts).toLocaleString("pt-BR", {day:"2-digit", month:"2-digit", year:"numeric", hour:"2-digit", minute:"2-digit"}) : "";
const diaSem = s => new Date(s + "T12:00:00").getDay();
const agoraHM = () => { const d = new Date(); return pad(d.getHours()) + ":" + pad(d.getMinutes()); };

/* ================= conexão (só ck_*) ================= */
const C = window.ESTOQUE_SUPABASE || {}, AUTH = {url:String(C.url || "").replace(/\/$/, ""), key:C.anonKey || ""};
let refrescando = null;
async function api(m, path, body, o = {}){
  const h = {apikey:AUTH.key, Accept:"application/json"};
  if (body !== undefined && !(body instanceof Blob)) h["Content-Type"] = "application/json";
  if (o.prefer) h.Prefer = o.prefer;
  if (o.tipo) h["Content-Type"] = o.tipo;
  if (o.token !== false) { const t = await token(); if (t) h.Authorization = "Bearer " + t; else if (/^eyJ/.test(AUTH.key)) h.Authorization = "Bearer " + AUTH.key; }
  const r = await fetch(AUTH.url + path, {method:m, headers:h, body:body === undefined ? undefined : (body instanceof Blob ? body : JSON.stringify(body)), cache:"no-store"});
  const tx = await r.text(); let j = null; try { j = tx ? JSON.parse(tx) : null; } catch (e) {}
  if (!r.ok) { const e = new Error((j && (j.message || j.msg || j.error_description || j.error)) || ("HTTP " + r.status)); e.status = r.status; throw e; }
  return j;
}
const rpc = (fn, b, o) => api("POST", "/rest/v1/rpc/" + fn, b || {}, o);
const tb = (t, q) => api("GET", "/rest/v1/" + t + "?" + (q || "select=*"));
function guarda(j){ S.sess = {access:j.access_token, refresh:j.refresh_token, exp:Date.now() + Number(j.expires_in || 3600) * 1000, uid:(j.user && j.user.id) || (S.sess && S.sess.uid)}; LS.set(K.sess, S.sess); }
async function token(){
  const s = S.sess; if (!s) return null;
  if (s.exp - 60000 > Date.now()) return s.access;
  if (!navigator.onLine) return s.access;
  if (s.emprestada || !s.refresh) { S.sess = null; LS.del(K.sess); if (S.perfil) { S.perfil = null; telaLogin("Sessão terminou. Entre de novo."); } return null; }
  if (!refrescando) refrescando = (async () => {
    try { guarda(await api("POST", "/auth/v1/token?grant_type=refresh_token", {refresh_token:s.refresh}, {token:false})); return S.sess.access; }
    catch (e) { if (e.status === 400 || e.status === 401) { S.sess = null; LS.del(K.sess); } return null; }
    finally { refrescando = null; }
  })();
  return refrescando;
}

/* ---------- visual (cores) definido pelo administrador: vale para todos os aparelhos ---------- */
const TEMAS = {
  padrao:{nome:"Azul noite (padrão)", bg:"#060b16", surface:"#0e1829", surface2:"#122038", ink:"#e6eef9", muted:"#8597b2", line:"#1f2f4a", cyan:"#22d3ee", brand:"#f97316", top:"#0a1426", dark:1},
  aldo:{nome:"Laranja Aldo", bg:"#140b05", surface:"#21140a", surface2:"#2c1b0e", ink:"#fff4ea", muted:"#c9a98e", line:"#3d2815", cyan:"#fb923c", brand:"#f97316", top:"#1b1007", dark:1},
  verde:{nome:"Verde", bg:"#04140e", surface:"#0a2119", surface2:"#0f2c21", ink:"#e7fbf2", muted:"#8fb8a6", line:"#184332", cyan:"#34d399", brand:"#22c55e", top:"#06190f", dark:1},
  vermelho:{nome:"Vermelho", bg:"#160608", surface:"#220b0e", surface2:"#2d1014", line:"#44191e", ink:"#fff0f1", muted:"#c79a9f", cyan:"#f87171", brand:"#ef4444", top:"#1c080b", dark:1},
  grafite:{nome:"Grafite", bg:"#111214", surface:"#1b1d21", surface2:"#24272c", ink:"#f1f2f4", muted:"#9aa0a8", line:"#33373e", cyan:"#a5b4fc", brand:"#f59e0b", top:"#16181b", dark:1},
  claro:{nome:"Claro", bg:"#f3f5f9", surface:"#ffffff", surface2:"#eef2f7", ink:"#0f172a", muted:"#5b6b82", line:"#d6dde8", cyan:"#0e7490", brand:"#ea580c", top:"#ffffff", dark:0},
  claroVerde:{nome:"Claro verde", bg:"#f2f8f5", surface:"#ffffff", surface2:"#e9f4ee", ink:"#0d2118", muted:"#557265", line:"#d3e6dc", cyan:"#047857", brand:"#16a34a", top:"#ffffff", dark:0}
};
const corTexto = h => { const n = parseInt(String(h).slice(1), 16), r = n >> 16 & 255, g = n >> 8 & 255, b = n & 255; return (0.299 * r + 0.587 * g + 0.114 * b) > 150 ? "#111111" : "#ffffff"; };
const hexRgb = h => { const n = parseInt(String(h).slice(1), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255].join(","); };
function aplicaVisual(v){
  v = v || {}; const t = {...(TEMAS[v.tema] || TEMAS.padrao)}; if (/^#[0-9a-f]{6}$/i.test(v.destaque || "")) t.cyan = v.destaque; if (/^#[0-9a-f]{6}$/i.test(v.botao || "")) t.brand = v.botao;
  let el = document.getElementById("ckVisual"); if (!el) { el = document.createElement("style"); el.id = "ckVisual"; document.head.appendChild(el); }
  el.textContent = `:root{--bg:${t.bg};--surface:${t.surface};--surface2:${t.surface2};--ink:${t.ink};--muted:${t.muted};--line:${t.line};--cyan:${t.cyan};--brand:${t.brand};--top:${t.top};--on-cyan:${corTexto(t.cyan)};--on-brand:${corTexto(t.brand)};--gridc:rgba(${hexRgb(t.cyan)},${v.grade === false ? 0 : t.dark ? .045 : .07});color-scheme:${t.dark ? "dark" : "light"}}${v.letra === "grande" ? "body{zoom:1.15}" : ""}`;
  const m = document.querySelector('meta[name="theme-color"]'); if (m) m.content = t.top;
}
aplicaVisual(LS.get(NS + ".ck.visual", null));
function telaVisual(){
  const v = S.visTmp || (S.visTmp = {tema:"padrao", letra:"normal", grade:true, ...((S.cfg || {}).visual || {})});
  aplicaVisual(v);
  return `<div class="card"><h2>🎨 Cores e visual</h2><p class="meta">Escolha o modelo. A prévia aparece na hora nesta tela; depois de salvar, vale para todos os celulares dos colaboradores.</p>
    <div class="tiles" style="grid-template-columns:repeat(auto-fill,minmax(140px,1fr))">${Object.entries(TEMAS).map(([k, t]) => `<button onclick="S.visTmp.tema='${k}';render()" style="text-align:left;cursor:pointer;border-radius:12px;padding:10px;background:${t.surface};color:${t.ink};border:2px solid ${v.tema === k ? t.cyan : t.line}">
      <div style="display:flex;gap:4px;margin-bottom:6px">${[t.bg, t.surface2, t.cyan, t.brand].map(c => `<i style="width:20px;height:20px;border-radius:6px;background:${c};border:1px solid ${t.line}"></i>`).join("")}</div><b style="font-size:13px">${t.nome}</b>${v.tema === k ? ` <span style="color:${t.cyan}">✔</span>` : ""}</button>`).join("")}</div>
    <div class="grid2" style="margin-top:8px"><label class="f">Cor de destaque (abas e títulos)<div class="row"><input type="color" value="${v.destaque || (TEMAS[v.tema] || TEMAS.padrao).cyan}" oninput="S.visTmp.destaque=this.value;aplicaVisual(S.visTmp)" style="width:56px;height:40px;border:0;background:none">${v.destaque ? `<button class="btn sm" onclick="delete S.visTmp.destaque;render()">usar do modelo</button>` : ""}</div></label>
      <label class="f">Cor dos botões principais<div class="row"><input type="color" value="${v.botao || (TEMAS[v.tema] || TEMAS.padrao).brand}" oninput="S.visTmp.botao=this.value;aplicaVisual(S.visTmp)" style="width:56px;height:40px;border:0;background:none">${v.botao ? `<button class="btn sm" onclick="delete S.visTmp.botao;render()">usar do modelo</button>` : ""}</div></label></div>
    <div class="chk" style="margin-top:8px"><label><input type="checkbox" ${v.letra === "grande" ? "checked" : ""} onchange="S.visTmp.letra=this.checked?'grande':'normal';aplicaVisual(S.visTmp)">🔠 Letras e botões maiores</label><label><input type="checkbox" ${v.grade !== false ? "checked" : ""} onchange="S.visTmp.grade=this.checked;aplicaVisual(S.visTmp)">▦ Fundo quadriculado</label></div>
    <div class="task" style="margin-top:10px"><div class="h">08:00</div><div class="n">🧹 Prévia: Limpeza da loja</div><div class="meta">Loja · 📷 Foto antes e depois</div><span class="pill p-pend">🔴 Pendente</span> <span class="pill p-ok">🟢 Concluído</span><button class="btn pri">▶️ INICIAR SERVIÇO</button></div>
    <div class="row"><button class="btn pri" style="flex:1" onclick="salvaVisual(this)">💾 Salvar para todos</button><button class="btn" style="flex:1" onclick="S.visTmp=null;aplicaVisual((S.cfg||{}).visual);render()">↩️ Desfazer</button></div></div>`;
}
async function salvaVisual(b){
  b.disabled = true; const v = {...S.visTmp};
  try { await api("POST", "/rest/v1/ck_config?on_conflict=filial", {filial:S.filial, retencao_dias:+(S.cfg || {}).retencao_dias || 90, visual:v}, {prefer:"resolution=merge-duplicates,return=minimal"}); S.cfg = {...S.cfg, visual:v}; LS.set(NS + ".ck.visual", v); toast("Visual salvo: os colaboradores veem na próxima atualização (até 1 minuto)."); }
  catch (e) { toast(/visual/.test(e.message) ? "Rode de novo o arquivo 07-checklist.sql no Supabase (coluna nova)." : e.message); }
  b.disabled = false;
}

/* ================= início ================= */
(async function start(){
  try {
    const qs = new URLSearchParams(location.search), qf = qs.get("f"), qu = qs.get("u");
    if (qf) LS.set(K.fil, qf.trim()); if (qu) LS.set(K.user, qu.trim());
    if (location.search) history.replaceState(null, "", location.pathname);
  } catch (e) {}
  S.filial = LS.get(K.fil, "") || (LS.get(K.estCfg, {}) || {}).filial || "";
  if (!AUTH.url || !AUTH.key) return msg("Sem conexão com o banco", "Confira o arquivo supabase-config.js.");
  S.sess = LS.get(K.sess, null);
  if (!S.sess) { const e = LS.get(K.estSess, null); if (e && e.access && e.exp - 120000 > Date.now()) S.sess = {access:e.access, exp:e.exp, uid:e.uid, emprestada:true}; } /* admin já logado no estoque: só usa o acesso atual, nunca renova (não mexe na sessão do estoque) */
  if (S.sess) { try { if (await token() && await carregaPerfil()) return entrou(); } catch (e) { console.error(e); if (!navigator.onLine && LS.get(NS + ".ck.perfil", null)) { S.perfil = LS.get(NS + ".ck.perfil", null); return entrou(true); } } }

async function demMuda(id, st, extra){
  if (!navigator.onLine) return toast("Sem internet: tente de novo quando a conexão voltar.");
  try { await api("PATCH", "/rest/v1/ck_demandas?id=eq." + id, {status:st, ...(st === "andamento" ? {iniciado_em:new Date().toISOString()} : {}), ...(extra || {})}, {prefer:"return=minimal"}); closeSheet(); await atualizaDia(); render(); toast(st === "andamento" ? "Demanda iniciada." : "Demanda enviada."); } catch (e) { toast(e.message); }
}
function demFinalizar(id){
  fotosTmp = []; const x = ((S.fil[hoje()] || {}).dem || []).find(d => d.id === id); if (!x) return;
  openSheet(`<h2>📌 ${esc(x.descricao)}</h2><label class="f">Resposta: o que foi feito? (obrigatório)<textarea id="dmR" class="inp" rows="3"></textarea></label>${slotFoto("foto", "📷 Foto (opcional)")}
    <button class="btn ok" onclick="demEnvia(${id},'concluido')">✅ CONCLUÍDA</button><button class="btn no" onclick="demEnvia(${id},'nao_realizado')">❌ NÃO DEU PARA FAZER</button><button class="btn" onclick="closeSheet()">Voltar</button>`);
}
async function demEnvia(id, st){
  const resp = $("#dmR").value.trim(); if (!resp) return toast("Escreva a resposta.");
  if (!navigator.onLine) return toast("Sem internet: tente de novo quando a conexão voltar.");
  try {
    const fotos = [];
    for (const f of fotosTmp) { const path = `${S.filial}/${hoje()}/demanda-${id}-${Date.now().toString(36)}.jpg`; await api("POST", "/storage/v1/object/checklist/" + path, await (await fetch(f.dataUrl)).blob(), {tipo:"image/jpeg"}); const {dataUrl, ...r} = f; fotos.push({...r, path}); }
    fotosTmp = []; await demMuda(id, st, {resposta:resp, fotos, concluido_em:new Date().toISOString()});
  } catch (e) { toast(e.message); }
}

/* ---------- expediente: local do posto, janela do link e horas trabalhadas ---------- */
function pegaLocal(){
  return new Promise(ok => { if (!navigator.geolocation) return ok(null);
    navigator.geolocation.getCurrentPosition(p => ok({lat:p.coords.latitude, lng:p.coords.longitude, prec:p.coords.accuracy}), () => ok(null), {enableHighAccuracy:true, timeout:15000, maximumAge:60000}); });
}
async function abrirJornada(){
  if (S.papel !== "colaborador") return true;
  const cache = LS.get(NS + ".ck.jor", null);
  if (!navigator.onLine) { if (cache && cache.data === hoje() && Date.now() < new Date(cache.ate).getTime()) { S.jor = cache; return true; } telaBloqueio({erro:"offline"}); return false; }
  $("#app").innerHTML = `<div class="msg"><b>📍 Conferindo o local…</b>Permita o acesso à localização quando o celular pedir.</div>`;
  const g = await pegaLocal();
  let j; try { j = await rpc("ck_abrir_jornada", {p_lat:g && g.lat, p_lng:g && g.lng, p_prec:g && g.prec}); } catch (e) { if (cache && cache.data === hoje() && Date.now() < new Date(cache.ate).getTime()) { S.jor = cache; return true; } telaBloqueio({erro:"rede", msg:e.message}); return false; }
  if (!j || !j.ok) { telaBloqueio(j || {}); return false; }
  S.jor = {data:hoje(), entrada:j.entrada, ate:j.ate, saida:j.saida || null}; LS.set(NS + ".ck.jor", S.jor);
  if (j.nova) toast("🕐 Entrada registrada às " + hmTs(j.entrada) + ". Link aberto até " + hmTs(j.ate) + ".");
  return true;
}

  const dh = t => t ? new Date(t).toLocaleString("pt-BR", {day:"2-digit", month:"2-digit", hour:"2-digit", minute:"2-digit"}) : "";
  const M = {fora_local:["📍 Você não está no posto", `Você está a <b>${j.distancia} m</b> do posto. O checklist só abre no local de trabalho (até ${j.raio || 200} m).`],
    sem_gps:["📍 Localização desligada", "Ative a localização do celular e permita o acesso para este site. Depois toque em Tentar de novo."],
    encerrada:["🔒 Expediente de hoje encerrado", `O link de hoje fechou às <b>${dh(j.ate)}</b>. Abre de novo em <b>${dh(j.libera_em)}</b>.<br>Se precisar antes, peça ao administrador para liberar.`],
    descanso:["🔒 Ainda no horário de descanso", `O link abre de novo em <b>${dh(j.libera_em)}</b> (10 horas depois do fim do expediente).<br>Se precisar antes, peça ao administrador para liberar.`],

  const [t, d] = M[j.erro] || ["🔒 Acesso bloqueado", "Fale com o administrador."];
  $("#app").innerHTML = `<div class="msg"><b>${t}</b>${d}<br><br><button class="btn pri" style="max-width:320px;margin:0 auto" onclick="S.bloqueado=false;abrirJornada().then(ok=>{if(ok){S.bloqueado=false;render()}})">🔄 Tentar de novo</button></div>`;
}
const hhmm = m => Math.floor(m / 60) + "h" + pad(Math.round(m % 60));
function horasDia(uid, d){
  const D = S.fil[d] || {}, cfg = S.cfg || {}, iMin = cfg.intervalo_min == null ? 60 : +cfg.intervalo_min, meta = (+(cfg.jornada_horas || 8)) * 60 - iMin;
  let J = (D.jor || []).find(j => j.user_id === uid) || null; if (!J && S.papel === "colaborador" && uid === S.perfil.user_id && S.jor && S.jor.data === d) J = S.jor;
  const t = s => new Date(s).getTime(), agora = Date.now(), iI = new Date(d + "T" + hm(cfg.intervalo_ini || "12:00") + ":00").getTime(), iF = iI + iMin * 60000;
  const ivs = [];
  linhasDia(d).filter(x => x.reg && x.reg.user_id === uid && x.reg.iniciado_em).forEach(x => ivs.push([t(x.reg.iniciado_em), x.reg.concluido_em ? t(x.reg.concluido_em) : agora, "etapa"]));
  (D.dem || []).filter(x => x.user_id === uid && x.iniciado_em).forEach(x => ivs.push([t(x.iniciado_em), x.concluido_em ? t(x.concluido_em) : agora, "demanda"]));
  (D.atv || []).filter(x => x.user_id === uid).forEach(x => ivs.push([t(x.inicio), t(x.fim), "atividade"]));
  const corta = ([a, b]) => b <= iI || a >= iF ? [[a, b]] : [...(a < iI ? [[a, iI]] : []), ...(b > iF ? [[iF, b]] : [])];
  const une = l => l.filter(([a, b]) => b > a).sort((x, y) => x[0] - y[0]).reduce((acc, [a, b]) => { const u = acc[acc.length - 1]; if (u && a <= u[1]) u[1] = Math.max(u[1], b); else acc.push([a, b]); return acc; }, []).flatMap(corta);
  const min = l => Math.round(l.reduce((s, [a, b]) => s + (b - a), 0) / 60000), uni = une(ivs.map(x => [x[0], x[1]])), tipo = k => min(une(ivs.filter(x => x[2] === k).map(x => [x[0], x[1]])));
  let gaps = [];
  if (J) { const ini = t(J.entrada), fimRef = J.saida ? t(J.saida) : Math.min(agora, t(J.ate)); let cur = ini; for (const [a, b] of uni) { if (a > cur) gaps.push([cur, Math.min(a, fimRef)]); cur = Math.max(cur, b); } if (fimRef > cur) gaps.push([cur, fimRef]); gaps = gaps.flatMap(corta).filter(([a, b]) => b - a >= 10 * 60000); }
  const reg = min(uni);
  return {J, meta, reg, falta:Math.max(0, meta - reg), etapas:tipo("etapa"), demandas:tipo("demanda"), atividades:tipo("atividade"), gaps, intervalo:hm(cfg.intervalo_ini || "12:00") + "–" + hmTs(iF)};
}

  return `<div class="card"><h2>🕐 Meu expediente</h2>
    ${J ? `<div class="meta">Entrada <b>${hmTs(J.entrada)}</b> · ${J.saida ? `encerrado às <b>${hmTs(J.saida)}</b>` : `link aberto até <b>${hmTs(J.ate)}</b>`} · intervalo ${H.intervalo}</div>` : ""}
    <div style="margin-top:8px"><b style="font-size:18px">${hhmm(H.reg)}</b> <span class="meta">registradas de ${hhmm(H.meta)} (8h com 1h de intervalo)</span></div><div class="bar"><i style="width:${pct}%;background:${H.falta ? "var(--warn)" : "var(--good)"}"></i></div>
    ${H.falta ? `<div class="meta" style="margin-top:4px">Faltam <b>${hhmm(H.falta)}</b>. ${todas ? "Você terminou as etapas: registre o que fez no tempo restante, com foto." : "Termine as etapas; o tempo que sobrar você justifica com foto."}</div>` : `<div class="meta" style="color:var(--good);margin-top:4px">✅ Horas do dia completas.</div>`}
    ${H.gaps.length ? `<div class="fslot"><b>⏳ Tempo sem registro</b>${H.gaps.map(([a, b]) => `<div class="row" style="justify-content:space-between;border-bottom:1px solid var(--line);padding:6px 0"><span>${hmTs(a)}–${hmTs(b)} · ${hhmm(Math.round((b - a) / 60000))}</span><button class="btn sm" onclick="formAtividade(${a},${b})">📝 Justificar</button></div>`).join("")}</div>` : ""}
    ${J && !J.saida ? `<div class="row"><button class="btn sm" onclick="formAtividade()">➕ Registrar o que fiz (com foto)</button><button class="btn sm" onclick="encerrarDia()">🏁 Encerrar o dia</button></div>` : ""}</div>`;
}
function formAtividade(a, b){
  fotosTmp = []; const hmD = ms => { const d = new Date(ms); return pad(d.getHours()) + ":" + pad(d.getMinutes()); };
  a = a || Date.now() - 30 * 60000; b = b || Date.now();
  openSheet(`<h2>📝 O que você fez neste tempo?</h2>
    <div class="grid2"><label class="f">Das<input id="atI" type="time" class="inp" value="${hmD(a)}"></label><label class="f">Até<input id="atF" type="time" class="inp" value="${hmD(b)}"></label></div>
    <label class="f">Atividade (obrigatório)<textarea id="atD" class="inp" rows="3" placeholder="Ex.: Organizei o depósito de materiais de limpeza"></textarea></label>
    ${slotFoto("foto", "📷 Foto (obrigatória)")}
    <button class="btn pri" id="btAt">💾 Registrar</button><button class="btn" onclick="closeSheet()">Voltar</button>`);
  $("#btAt").onclick = async () => {
    const desc = $("#atD").value.trim(), d = hoje(), ini = new Date(d + "T" + $("#atI").value + ":00"), fim = new Date(d + "T" + $("#atF").value + ":00");
    if (!desc) return toast("Escreva o que você fez."); if (!(fim > ini)) return toast("O horário final tem que ser depois do inicial."); if (fim.getTime() > Date.now() + 5 * 60000) return toast("Não dá para registrar horário que ainda não passou.");
    if (!fotosTmp.length) return toast("Tire a foto da atividade."); if (!navigator.onLine) return toast("Sem internet: tente de novo quando a conexão voltar.");
    $("#btAt").disabled = true;
    try {
      const fotos = []; for (const f of fotosTmp) { const path = `${S.filial}/${d}/atividade-${Date.now().toString(36)}${Math.random().toString(36).slice(2, 5)}.jpg`; await api("POST", "/storage/v1/object/checklist/" + path, await (await fetch(f.dataUrl)).blob(), {tipo:"image/jpeg"}); const {dataUrl, ...r} = f; fotos.push({...r, path}); }
      await api("POST", "/rest/v1/ck_atividades", {filial:S.filial, user_id:S.perfil.user_id, colaborador:S.perfil.nome, data:d, inicio:ini.toISOString(), fim:fim.toISOString(), descricao:desc, fotos}, {prefer:"return=minimal"});
      fotosTmp = []; closeSheet(); await atualizaDia(); render(); toast("Atividade registrada.");
    } catch (e) { $("#btAt").disabled = false; toast(/row-level/.test(e.message) ? "Seu horário de hoje já fechou. Fale com o administrador." : e.message); }
  };
}
async function encerrarDia(){
  const L = linhasDia(hoje()).filter(x => x.resp === S.perfil.user_id), pend = L.filter(x => !FINAL(x.st)).length, H = horasDia(S.perfil.user_id, hoje());
  if (!confirm((pend ? "Ainda há " + pend + " etapa(s) sem finalizar. " : "") + (H.falta ? "Faltam " + hhmm(H.falta) + " sem registro (o administrador será avisado). " : "") + "Encerrar o dia? Depois disso o link só abre de novo amanhã.")) return;
  try { await rpc("ck_encerrar_jornada"); S.jor = {...S.jor, saida:new Date().toISOString(), ate:new Date().toISOString()}; LS.set(NS + ".ck.jor", S.jor); toast("Dia encerrado. Bom descanso!"); telaBloqueio({erro:"encerrada", ate:S.jor.ate, libera_em:new Date(Date.now() + (+((S.cfg || {}).descanso_horas || 10)) * 3600000).toISOString()}); } catch (e) { toast(e.message); }
}

    <p class="meta" style="margin-top:10px">🕐 Expediente: <b>8h</b> no total, com <b>1h de intervalo às ${hm(c.intervalo_ini || "12:00")}</b>. O link fica aberto <b>${c.janela_horas || 8}h</b> desde a 1ª abertura do dia e só abre de novo <b>${c.descanso_horas || 10}h</b> depois. Para liberar antes, use 🔓 em ⏱️ Horas do dia.</p></div>`;
}
async function gravaLocal(b){
  b.disabled = true; toast("Pegando a localização…"); const g = await pegaLocal(); b.disabled = false;
  if (!g) return toast("Não foi possível pegar a localização. Permita o acesso e tente de novo.");
  if (g.prec > 150 && !confirm("A precisão está baixa (" + Math.round(g.prec) + " m). Gravar assim mesmo? Melhor tentar ao ar livre.")) return;
  try { await api("POST", "/rest/v1/ck_config?on_conflict=filial", {filial:S.filial, retencao_dias:+(S.cfg || {}).retencao_dias || 90, posto_lat:g.lat, posto_lng:g.lng, posto_raio:+$("#lcR").value}, {prefer:"resolution=merge-duplicates,return=minimal"}); await carregaBase(); render(); toast("Local do posto gravado."); } catch (e) { toast(/posto_/.test(e.message) ? "Rode de novo o arquivo 07-checklist.sql no Supabase." : e.message); }
}
/* abono: só pelo botão da demanda extra (etapa que o colaborador não cumpriu por causa dela) */
function abonarDemanda(id){
  const dm = ((S.fil[S.data] || {}).dem || []).find(x => x.id === id); if (!dm) return;
  const L = linhasDia(dm.data).filter(x => x.resp === dm.user_id && !x.ab && (foraHorario(x) || !FINAL(x.st)));
  if (!L.length) return toast("Nenhuma etapa de " + nomeU(dm.user_id) + " para abonar neste dia.");
  openSheet(`<h2>🛡️ Abonar etapa</h2><p class="meta">Demanda extra: <b>${esc(dm.descricao)}</b> · ${esc(nomeU(dm.user_id))}</p>
    <label class="f">Qual etapa o colaborador não cumpriu por causa desta demanda?<select id="abS" class="inp">${L.map(x => `<option value="${x.s.id}">${janela(x.s)} ${esc(x.s.nome)} · ${ST[x.st][0]}</option>`).join("")}</select></label>
    <button class="btn pri" id="btAb">🛡️ Abonar</button><button class="btn" onclick="closeSheet()">Voltar</button>`);
  $("#btAb").onclick = async () => { const sv = +$("#abS").value;
    try { await api("POST", "/rest/v1/ck_abonos?on_conflict=servico_id,data", {filial:S.filial, servico_id:sv, data:dm.data, motivo:"Demanda extra: " + dm.descricao, demanda_id:dm.id, por_nome:S.perfil.nome || S.perfil.login}, {prefer:"resolution=merge-duplicates,return=minimal"});
      await api("PATCH", "/rest/v1/ck_demandas?id=eq." + dm.id, {servico_abonado:sv}, {prefer:"return=minimal"}); closeSheet(); await atualizaDia(); render(); toast("Etapa abonada."); } catch (e) { toast(e.message); } };
}
</script>
