<script>

const NS = (() => { const p = location.pathname.replace(/[^/]*$/, "").replace(/\/+$/, ""); return (p === "" || p === "/controle-de-estoque") ? "estoque" : "estoque@" + p; })();

const hhmm = m => Math.floor(m / 60) + "h" + pad(Math.round(m % 60));
function horasDia(uid, d){
  const D = S.fil[d] || {}, cfg = S.cfg || {}, iMin = cfg.intervalo_min == null ? 60 : +cfg.intervalo_min, meta = (+(cfg.jornada_horas || 8)) * 60 - iMin;
  let J = (D.jor || []).find(j => j.user_id === uid) || null; if (!J && S.papel === "colaborador" && uid === S.perfil.user_id && S.jor && S.jor.data === d) J = S.jor;
  const t = s => new Date(s).getTime(), agora = Date.now(), iI = new Date(d + "T" + hm(cfg.intervalo_ini || "12:00") + ":00").getTime(), iF = iI + iMin * 60000;
  const ivs = [];
  linhasDia(d).filter(x => x.reg && x.reg.user_id === uid && x.reg.iniciado_em).forEach(x => ivs.push([t(x.reg.iniciado_em), x.reg.concluido_em ? t(x.reg.concluido_em) : agora, "etapa"]));
  (D.dem || []).filter(x => x.user_id === uid && x.iniciado_em).forEach(x => ivs.push([t(x.iniciado_em), x.concluido_em ? t(x.concluido_em) : agora, "demanda"]));
  (D.atv || []).filter(x => x.user_id === uid).forEach(x => ivs.push([t(x.inicio), t(x.fim), "atividade"]));
  const corta = ([a, b]) => b <= iI || a >= iF ? [[a, b]] : [...(a < iI ? [[a, iI]] : []), ...(b > iF ? [[iF, b]] : [])];
  const une = l => l.filter(([a, b]) => b > a).sort((x, y) => x[0] - y[0]).reduce((acc, [a, b]) => { const u = acc[acc.length - 1]; if (u && a <= u[1]) u[1] = Math.max(u[1], b); else acc.push([a, b]); return acc; }, []).flatMap(corta);
  const min = l => Math.round(l.reduce((s, [a, b]) => s + (b - a), 0) / 60000), uni = une(ivs.map(x => [x[0], x[1]])), tipo = k => min(une(ivs.filter(x => x[2] === k).map(x => [x[0], x[1]])));
  let gaps = [];
  if (J) { const ini = t(J.entrada), fimRef = J.saida ? t(J.saida) : Math.min(agora, t(J.ate)); let cur = ini; for (const [a, b] of uni) { if (a > cur) gaps.push([cur, Math.min(a, fimRef)]); cur = Math.max(cur, b); } if (fimRef > cur) gaps.push([cur, fimRef]); gaps = gaps.flatMap(corta).filter(([a, b]) => b - a >= 10 * 60000); }
  const reg = min(uni);
  return {J, meta, reg, falta:Math.max(0, meta - reg), etapas:tipo("etapa"), demandas:tipo("demanda"), atividades:tipo("atividade"), gaps, intervalo:hm(cfg.intervalo_ini || "12:00") + "–" + hmTs(iF)};
}
